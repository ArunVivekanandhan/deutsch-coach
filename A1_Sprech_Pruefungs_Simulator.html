<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Speaking Coach &amp; A1 Exam Simulator — Dein Deutsch-Coach</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE1; --paper-dark:#E1DDCF; --card:#F7F5EE; --ink:#1B2A4A; --ink-soft:#4A5878;
    --red:#AE3327; --red-dark:#8A281F; --gold:#B98A2E; --green:#3F6B4A; --blue:#2F5C8A;
    --purple:#6B4A8A; --line:#cdc7b2; --shadow:rgba(27,42,74,0.18);
  }
  html.dark-theme {
    --paper:#0f172a; --paper-dark:#1e293b; --card:#1e293b; --ink:#f8fafc; --ink-soft:#94a3b8;
    --red:#f87171; --red-dark:#ef4444; --gold:#fbbf24; --green:#4ade80; --blue:#38bdf8;
    --purple:#c084fc; --line:#334155; --shadow:rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  .wrap{width:100%; max-width:850px;}

  h1{font-family:'Fjalla One',sans-serif; font-size:24px; border-bottom:3px solid var(--ink); padding-bottom:6px; margin:0 0 4px;}
  .sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:14px;}

  /* Mode Navigation */
  .modetabs{display:flex; gap:6px; margin-bottom:14px;}
  .modetab{
    flex:1; font-family:'Fjalla One',sans-serif; font-size:14px; padding:10px 4px; text-align:center;
    border:1.5px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
    cursor:pointer; transition:all .15s;
  }
  .modetab.active{background:var(--ink); color:#fff;}

  /* Sub-tabs */
  .subtabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
  .subtab{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 12px; border:1.5px solid var(--line);
    background:var(--card); border-radius:16px; cursor:pointer; color:var(--ink-soft); white-space:nowrap;
    font-weight:600;
  }
  .subtab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* Content Cards */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 24px var(--shadow); padding:18px; margin-bottom:16px;
  }
  .card-title{font-family:'Fjalla One',sans-serif; font-size:20px; color:var(--ink); margin:0 0 6px;}
  .card-desc{font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px;}

  /* Partner / Examiner Simulation Box */
  .dialog-stream{display:flex; flex-direction:column; gap:12px; margin-bottom:16px;}
  .speech-bubble{
    padding:12px 14px; border-radius:8px; max-width:85%; font-size:14px; line-height:1.5;
    position:relative;
  }
  .speech-bubble.examiner{
    background:#E2E8F0; border-left:4px solid var(--blue); align-self:flex-start;
  }
  .speech-bubble.user{
    background:#E2EED8; border-right:4px solid var(--green); align-self:flex-end;
  }
  .speaker-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    margin-bottom:4px; font-weight:700; color:var(--ink-soft);
  }
  .speaker-audio-btn{
    background:none; border:none; cursor:pointer; font-size:14px; margin-left:6px;
  }

  /* Redemittel Grid & Soundboard */
  .phrase-grid{display:grid; grid-template-columns:1fr; gap:8px;}
  @media(min-width:600px){ .phrase-grid{grid-template-columns:1fr 1fr;} }
  .phrase-card{
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .phrase-de{font-size:13.5px; font-weight:600; color:var(--ink);}
  .phrase-en{font-size:11px; color:var(--ink-soft); margin-top:2px; font-style:italic;}

  .audio-btn{
    background:none; border:1.5px solid var(--line); border-radius:50%; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
    flex-shrink:0; transition:all .15s;
  }
  .audio-btn:hover{background:var(--paper); border-color:var(--ink);}

  /* Action Buttons */
  .bigbtn{
    width:100%; font-family:'Fjalla One',sans-serif; font-size:16px; padding:14px; border:none;
    border-radius:6px; background:var(--ink); color:#fff; cursor:pointer; text-align:center;
    box-shadow:0 4px 0 #0d1525; margin-top:10px;
  }
  .bigbtn:active{transform:translateY(2px); box-shadow:0 2px 0 #0d1525;}
  .bigbtn.secondary{background:var(--red); box-shadow:0 4px 0 var(--red-dark);}
  .bigbtn.green{background:var(--green); box-shadow:0 4px 0 #28442e;}

  @keyframes slideIn { from{opacity:0; transform:translateX(-10px);} to{opacity:1; transform:translateX(0);} }

  .diffchar{background:#fff3a0; padding:0 2px; border-radius:3px; font-weight:700; color:var(--red-dark);}
  .user-transcript{
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px;
    margin-top:10px; font-size:14px; line-height:1.6; display:none;
    animation: slideIn 0.3s ease-out;
  }
  .user-transcript.visible{display:block;}
  .transcript-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);
    text-transform:uppercase; margin-bottom:5px; display:block; font-weight:700;
  }
  .rec-btn{
    background:none; border:1.5px solid var(--line); border-radius:50%; width:32px; height:32px;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
    flex-shrink:0; transition:all .15s;
  }
  .rec-btn:hover{background:var(--paper); border-color:var(--ink);}
  .rec-btn.recording{background:var(--red); color:#fff; border-color:var(--red); animation: pulse 1.5s infinite;}
  @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.5;} 100%{opacity:1;} }

  /* Form / Cloze Styles */
  .cloze-text{
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px;
    font-size:14.5px; line-height:2.0; margin-bottom:14px;
  }
  .form-field{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:center;
    padding:8px 0; border-bottom:1px dashed var(--line);
  }
  .form-field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .form-field input{
    font-family:'IBM Plex Mono',monospace; font-size:13px; padding:6px 8px;
    border:1.5px solid var(--ink); border-radius:4px; background:var(--paper); color:var(--ink); width:100%;
  }
  .checklist-item{
    display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line);
    font-size:13px;
  }
  .checklist-item input{margin-top:3px;}

  /* Global Modern UI Additions */
  body { transition: background-color 0.3s ease, color 0.3s ease; }
  .stage {
    background: var(--card); border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    border: 1px solid var(--line); padding: 24px; margin-top: 10px;
    transition: box-shadow 0.3s ease;
  }
  body.dark .stage { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4); }
  button { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, background-color 0.2s; }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  button:active:not(:disabled) { transform: translateY(0); }
  input[type="text"], textarea, select {
    border-radius: 8px; border: 1px solid var(--line); padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s; background: var(--paper); color: var(--ink);
  }
  input[type="text"]:focus, textarea:focus {
    outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
</style>

  </div>

  <!-- Subtabs -->
  <div class="subtabs" id="subTabs"></div>

  <!-- Exam Timer Bar -->
  <div style="background:#fff; border:1.5px solid var(--ink); border-radius:8px; padding:10px 14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; box-shadow:0 3px 8px var(--shadow);">
    <div style="font-family:'Fjalla One',sans-serif; font-size:14px; color:var(--ink); display:flex; align-items:center; gap:8px;">
      ⏱️ <span id="timerLabel">Exam Timer</span>: <span id="timerDisplay" style="font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; color:var(--red);">15:00</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button onclick="setExamTimer(15*60, '15m Full Exam')" style="padding:4px 9px; font-size:11px; font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); border-radius:4px; cursor:pointer; background:var(--paper);" class="ds-btn ds-btn-secondary">15m Full</button>
      <button onclick="setExamTimer(1*60, '1m per Bitte')" style="padding:4px 9px; font-size:11px; font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); border-radius:4px; cursor:pointer; background:var(--paper);" class="ds-btn ds-btn-secondary">1m Teil 3</button>
      <button id="timerToggleBtn" onclick="toggleTimer()" style="padding:4px 10px; font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace; border:1.5px solid var(--ink); border-radius:4px; cursor:pointer; background:var(--ink); color:#fff;" class="ds-btn ds-btn-secondary">▶ Start</button>
      <button onclick="resetTimer()" style="padding:4px 8px; font-size:11px; font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); border-radius:4px; cursor:pointer; background:var(--paper);" class="ds-btn ds-btn-secondary">↺</button>
    </div>
  </div>

  <!-- Main Container -->
  <div id="mainView"></div>

</div>

/* =========================================================================
   UI CONTROLLER
   ========================================================================= */
function init(){
  renderSubTabs();
  renderView();
}

function setMode(mode){
  currentMode = mode;
  document.getElementById("tabOral").className = "modetab " + (mode==='oral'?'active':'');
  document.getElementById("tabVault").className = "modetab " + (mode==='vault'?'active':'');
  document.getElementById("tabWritten").className = "modetab " + (mode==='written'?'active':'');

  if(mode === 'oral') currentSub = 'teil1';
  else if(mode === 'vault') currentSub = 'vault';
  else if(mode === 'written') currentSub = 'form';

  renderSubTabs();
  renderView();
}

function setSub(sub){
  currentSub = sub;
  renderSubTabs();
  renderView();
}

function renderSubTabs(){
  const container = document.getElementById("subTabs");
  let items = [];
  if(currentMode === 'oral'){
    items = [
      {id:'teil1', label:'Teil 1: Sich vorstellen (Introduce Yourself)'},
      {id:'teil2', label:'Teil 2: Informationen erfragen (Ask & Answer)'},
      {id:'teil3', label:'Teil 3: Bitten formulieren (Make a Request)'}
    ];
  } else if(currentMode === 'vault'){
    items = [

}

/* ---------------- AUDIO PLAYBACK ---------------- */
function speak(txt){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "de-DE";
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

/* ---------------- DIFF HIGHLIGHT ---------------- */
function diffHighlight(a, b){
  let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++;
  let j=0; while(j<a.length-i && j<b.length-i && a[a.length-1-j]===b[b.length-1-j]) j++;
  const aMid=a.slice(i,a.length-j), bMid=b.slice(i,b.length-j);
  const wrap=(s)=> s?`<span class="diffchar">${s}</span>`:'';
  return { a: a.slice(0,i)+wrap(aMid)+a.slice(a.length-j), b: b.slice(0,i)+wrap(bMid)+b.slice(b.length-j) };
}

/* ---------------- SPEECH RECOGNITION ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recObj = null;

function startRecording(targetText, containerId) {
  if (!SR) {
    alert("Speech recognition not supported in this browser. Please use Chrome or Edge.");
    return;
  }

  const btn = event.currentTarget;
  btn.classList.add('recording');
  btn.innerText = '🛑';

  recObj = new SR();
  recObj.lang = "de-DE";
  recObj.interimResults = false;

  recObj.onresult = (ev) => {
    const transcript = ev.results[0][0].transcript;
    showComparison(targetText, transcript, containerId);
    stopRecording(btn);
  };

  recObj.onerror = (ev) => {
    console.error("SR Error:", ev.error);
    stopRecording(btn);
  };

  recObj.onend = () => {
    stopRecording(btn);
  };

  recObj.start();
}

function stopRecording(btn) {
  if (recObj) {
    recObj.stop();
    recObj = null;
  }
  if (btn) {
    btn.classList.remove('recording');
    btn.innerText = '🎙️';
  }
}

function showComparison(target, spoken, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const diff = diffHighlight(target.toLowerCase().trim(), spoken.toLowerCase().trim());

  const feedbackHtml = `
    <div class="user-transcript visible" id="transcript_${containerId}">
      <span class="transcript-label">Your Spoken Version:</span>
      <div style="margin-bottom:8px;">${diff.b}</div>
      <span class="transcript-label">Target Version:</span>
      <div>${diff.a}</div>
    </div>
  `;

  const existing = container.querySelector('.user-transcript');
  if (existing) existing.remove();
  container.insertAdjacentHTML('beforeend', feedbackHtml);
}

/* ---------------- EXAM TIMER ---------------- */
let timerSeconds = 15*60;
let timerInterval = null;
let timerRunning = false;

function setExamTimer(seconds, label){
  timerSeconds = seconds;
  timerRunning = false;
  clearInterval(timerInterval);
  document.getElementById('timerLabel').innerText = label;
  document.getElementById('timerToggleBtn').innerText = '▶ Start';
  updateTimerDisplay();
}

function toggleTimer(){
  const btn = document.getElementById('timerToggleBtn');
  if(timerRunning){
    clearInterval(timerInterval);
    timerRunning = false;
    btn.innerText = '▶ Start';
  } else {
    timerRunning = true;
    btn.innerText = '⏸ Pause';
    timerInterval = setInterval(()=>{
      if(timerSeconds > 0){
        timerSeconds--;
        updateTimerDisplay();
      } else {
        clearInterval(timerInterval);
        timerRunning = false;
        btn.innerText = '▶ Start';
      }
    }, 1000);
  }
}

function resetTimer(){
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 15*60;
  document.getElementById('timerLabel').innerText = 'Exam Timer';
  document.getElementById('timerToggleBtn').innerText = '▶ Start';
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const m = Math.floor(timerSeconds/60);
  const s = timerSeconds%60;
  document.getElementById('timerDisplay').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function toggleTheme(){
  const isDark = document.documentElement.classList.toggle('dark-theme');
  localStorage.setItem('de_theme', isDark ? 'dark' : 'light');
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.innerText = isDark ? '☀️ Theme' : '🌙 Theme';
}

function initTheme(){
  const saved = localStorage.getItem('de_theme');
  if(saved === 'dark'){
    document.documentElement.classList.add('dark-theme');
    const btn = document.getElementById('themeToggleBtn');
    if(btn) btn.innerText = '☀️ Theme';
  }
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

document.addEventListener('DOMContentLoaded', function(){
  initTheme();
  init();
  updateTimerDisplay();
});

// UNIFIED SUITE THEME SYSTEM
function initSuiteTheme() {
  const saved = localStorage.getItem('de_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved === 'dark' || (!saved && prefersDark);
  applyTheme(isDark);
}
function applyTheme(isDark) {
  if (isDark) {
    document.documentElement.classList.add('dark-theme');
    document.body.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark-theme');
    document.body.classList.remove('dark');
  }
  const btn = document.getElementById('themeToggleBtn') || document.getElementById('themeToggle');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}
function toggleSuiteTheme() {
  const isDarkNow = document.documentElement.classList.contains('dark-theme') || document.body.classList.contains('dark');
  const nextDark = !isDarkNow;
  localStorage.setItem('de_theme', nextDark ? 'dark' : 'light');
  applyTheme(nextDark);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSuiteTheme);
} else {
  initSuiteTheme();
}
