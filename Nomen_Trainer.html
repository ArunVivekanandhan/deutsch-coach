<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Nomen — Form Trainer</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE1; --paper-dark:#E1DDCF; --card:#F7F5EE; --ink:#1B2A4A; --ink-soft:#4A5878;
    --red:#AE3327; --red-dark:#8A281F; --gold:#B98A2E; --green:#3F6B4A; --blue:#2F5C8A;
    --purple:#6B4A8A; --der:#2563eb; --die:#dc2626; --das:#16a34a; --line:#cdc7b2; --shadow:rgba(27,42,74,0.18);
  }
  *{box-sizing:border-box;}
  /* legacy body removed */
  .wrap{width:100%; max-width:640px;}
  h1{font-family:'Fjalla One',sans-serif; font-size:22px; border-bottom:3px solid var(--ink); padding-bottom:8px; margin:0 0 4px;}
  .sub{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:14px;}

  .modetabs{display:flex; gap:6px; margin-bottom:12px;}
  .modetab{flex:1; font-family:'Fjalla One',sans-serif; font-size:15px; padding:11px; text-align:center;
    border:1.5px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink); cursor:pointer;}
  .modetab.active{background:var(--ink); color:#fff;}

  .filterbox{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    margin-bottom:14px; box-shadow:0 6px 14px var(--shadow);}
  .filterlabel{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.6px; color:var(--ink-soft); margin:2px 0 6px;}
  .chiprow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .chip{font-family:'IBM Plex Mono',monospace; font-size:11px; padding:7px 11px; border:1.5px solid var(--line);
    background:var(--paper); border-radius:16px; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; gap:5px;}
  .chip.active{border-color:var(--ink); color:var(--ink); font-weight:600; background:#fff;}
  .chip .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .dot-e{background:var(--blue);} .dot-er{background:var(--red);} .dot-en{background:var(--gold);}
  .dot-s{background:var(--purple);} .dot-unchanged{background:var(--green);} .dot-umlaut_only{background:#8a6a1e;}
  .dot-regular{background:var(--blue);} .dot-umlaut{background:var(--red);} .dot-irregular{background:var(--gold);}

  .countline{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); text-align:center; margin-bottom:2px;}
  .dashgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:12px 0;} @media (max-width: 480px) { .dashgrid { grid-template-columns:repeat(2,1fr); } }
  .dashcard{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center;}
  .dashcard .num{font-family:'Fjalla One',sans-serif; font-size:19px; color:var(--red);}
  .dashcard .lbl{font-family:'IBM Plex Mono',monospace; font-size:8.5px; color:var(--ink-soft); margin-top:1px;}

  .bigbtn{width:100%; font-family:'Fjalla One',sans-serif; font-size:18px; padding:16px; border:none;
    border-radius:8px; background:var(--red); color:#fff; cursor:pointer; box-shadow:0 6px 0 var(--red-dark); margin-bottom:8px;}
  .bigbtn:active{transform:translateY(3px); box-shadow:0 3px 0 var(--red-dark);}
  .bigbtn .subtext{display:block; font-family:'IBM Plex Sans',sans-serif; font-size:11px; font-weight:400; opacity:0.9; margin-top:3px;}

  .togglerow{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .togglerow label{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .switch{position:relative; width:38px; height:20px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:.2s;}
  .slider:before{content:""; position:absolute; width:16px; height:16px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s;}
  input:checked + .slider{background:var(--green);}
  input:checked + .slider:before{transform:translateX(18px);}

  .sessionbar{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); text-align:center; margin-bottom:10px;}
  .studycard{background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 24px var(--shadow);
    overflow:hidden; margin-bottom:14px;}
  .stripe{height:6px;}
  .stripe.e,.stripe.regular{background:var(--blue);} .stripe.er,.stripe.umlaut{background:var(--red);}
  .stripe.en,.stripe.irregular{background:var(--gold);} .stripe.s{background:var(--purple);}
  .stripe.unchanged{background:var(--green);} .stripe.umlaut_only{background:#8a6a1e;}
  .meta{display:flex; justify-content:space-between; align-items:center; padding:10px 16px 0;
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);}
  .pill{font-size:9px; text-transform:uppercase; letter-spacing:0.5px; padding:2px 8px; border-radius:10px; color:#fff;}
  .pill.e,.pill.regular{background:var(--blue);} .pill.er,.pill.umlaut{background:var(--red);}
  .pill.en,.pill.irregular{background:var(--gold);} .pill.s{background:var(--purple);}
  .pill.unchanged{background:var(--green);} .pill.umlaut_only{background:#8a6a1e;}
  .pill.level{background:var(--purple);}
  .qlabel{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); text-transform:uppercase;
    letter-spacing:0.5px; padding:12px 18px 0;}
  .wordicon{width:52px; height:52px; margin:6px auto 4px; color:var(--ink-soft);}
  .wordicon svg{width:100%; height:100%;}
  .wordline{display:flex; align-items:center; justify-content:center; gap:2px;}
  .prompt{padding:0 18px 4px; text-align:center;}
  .prompt .word{font-family:'Fjalla One',sans-serif; font-size:28px; line-height:1.2; color:var(--ink);}
  .prompt .subq{font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; color:var(--ink-soft); margin-top:6px;}
  .speakbtn{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%;
    border:1.5px solid var(--ink); background:var(--paper); color:var(--ink); cursor:pointer; font-size:14px; margin-left:8px; flex-shrink:0;}
  .thinkbtn{display:block; width:calc(100% - 36px); margin:14px 18px 18px; font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase; letter-spacing:0.5px; padding:13px; border:1.5px dashed var(--ink); background:transparent;
    color:var(--ink); border-radius:6px; cursor:pointer;}

  .revealbox{padding:4px 18px 16px;}
  .meaningbox{text-align:center; margin-bottom:8px;}
  .meaningbox .en{font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-style:italic; color:var(--ink-soft);}
  .meaningbox .ta{font-size:16px; color:var(--ink); margin-top:2px;}
  .meaningbox .ta .translit{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-left:6px;}
  .formrow{display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono',monospace;
    font-size:14px; padding:8px 10px; background:var(--paper-dark); border-radius:5px; margin-bottom:6px;}
  .formrow .flabel{font-size:10px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.4px;}
  .formrow .fval{font-weight:600;}
  .diffchar{background:#fff3a0; padding:0 2px; border-radius:3px; font-weight:700; color:var(--red-dark);}
  .transdiagram{font-family:'IBM Plex Mono',monospace; font-size:15px; text-align:center; padding:10px 8px;
    background:var(--paper-dark); border-radius:6px; margin-bottom:8px; line-height:1.9;}
  .transdiagram .arrow{color:var(--ink-soft); margin:0 6px; font-size:13px;}
  .rulebox{font-size:12.5px; line-height:1.55; padding:9px 11px; border-radius:0 5px 5px 0; margin-bottom:8px;}
  .rulebox.e,.rulebox.regular{background:#eaeef6; border-left:3px solid var(--blue);}
  .rulebox.er,.rulebox.umlaut{background:#f6e9e7; border-left:3px solid var(--red);}
  .rulebox.en,.rulebox.irregular{background:#fbf3d8; border-left:3px solid var(--gold);}
  .rulebox.s{background:#f0eaf5; border-left:3px solid var(--purple);}
  .rulebox.unchanged{background:#eaf2ea; border-left:3px solid var(--green);}
  .rulebox.umlaut_only{background:#f5efe0; border-left:3px solid #8a6a1e;}
  .rulebox b{color:var(--ink);}

  /* Morphological & Memory Trick Box */
  .morph-box {
    background: #fff; border: 1.5px solid var(--gold); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(185,138,46,0.1);
    text-align: left;
  }
  .morph-header {
    font-family: 'Fjalla One', sans-serif; font-size: 13.5px; color: var(--gold);
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .morph-mnemonic {
    font-size: 12.5px; line-height: 1.55; color: var(--ink);
    background: #fffdf5; border-left: 3px solid var(--gold); padding: 8px 10px;
    border-radius: 0 4px 4px 0; margin-bottom: 8px;
  }
  .morph-mnemonic b { color: var(--red); }
  .morph-formula {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    background: var(--paper); padding: 6px 10px; border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; margin-bottom: 8px;
  }
  .morph-part { padding: 2px 7px; border-radius: 4px; font-weight: 700; }
  .morph-part.prefix { background: #e8e0f0; color: var(--purple); }
  .morph-part.root { background: #dce7f2; color: var(--blue); }

  .answerbtns{display:flex; gap:8px; padding:0 18px 18px;}
  .actbtn{flex:1; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.3px; text-transform:uppercase;
    padding:13px 2px; border-radius:6px; cursor:pointer; border:1.5px solid var(--ink); background:var(--paper);}
  .actbtn.nochmal{border-color:var(--red); color:var(--red);}
  .actbtn.gewusst{border-color:var(--green); color:var(--green);}
  .actbtn.easy{border-color:var(--blue); color:var(--blue);}
  .empty{text-align:center; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:13px; line-height:1.7; padding:26px 10px;}
  .empty b{color:var(--ink);}
  .voicewarn{font-size:11px; color:var(--red-dark); background:#f6e9e7; border-left:3px solid var(--red);
    padding:6px 9px; border-radius:0 5px 5px 0; margin-bottom:10px; display:none;}
  footer{margin-top:20px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); text-align:center; line-height:1.6;}

  .word-click-reveal {
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
    border-bottom: 2px dotted var(--gold);
    display: inline-block;
  }
  .word-click-reveal:hover {
    background: #fffdf5;
    color: #b45309;
    transform: translateY(-1px);
  }
  .peek-translation-box {
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .quick-card-tools {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .quick-tool-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-tool-btn:hover {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .actbtn.next-bold:hover {
    opacity: 0.92;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px var(--shadow);
  }
  .shortcuts-hint {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft);
    text-align: center; margin-top: 12px; opacity: 0.9;
  }

  html.dark-theme {
    --paper: #121212; --paper-dark: #1E1E1E; --card: #242424; --ink: #E0E0E0; --ink-soft: #A0A0A0;
    --line: #444; --shadow: rgba(0,0,0,0.5); --stamp-red: #ff5555; --stamp-red-dark: #cc0000;
    --gold: #ffcc00; --green: #55cc55; --blue: #5599ff; --purple: #b366ff;
  }


  .hub-banner{
    background:var(--card); border:1.5px solid var(--ink); border-radius:8px;
    padding:8px 12px; margin-bottom:12px; display:flex; justify-content:space-between;
    align-items:center; flex-wrap:wrap; gap:8px; box-shadow:0 3px 8px var(--shadow);
    width:100%; max-width:1100px;
  }
  .hub-title{font-family:'Fjalla One',sans-serif; font-size:13.5px; display:flex; align-items:center; gap:6px; color:var(--ink);}
  .hub-links{display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
  .hub-link{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 8px; border-radius:4px;
    text-decoration:none; color:var(--ink); background:var(--paper); border:1px solid var(--line);
    transition:all .15s; font-weight:600; cursor:pointer;
  }
  .hub-link:hover, .hub-link.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}


/* UNIFIED DEUTSCH-COACH SUITE THEME & HUB */
:root {
  --suite-bg: #EDEAE1;
  --suite-card: #F7F5EE;
  --suite-card-hover: #ffffff;
  --suite-ink: #1B2A4A;
  --suite-ink-soft: #4A5878;
  --suite-line: #cdc7b2;
  --suite-gold: #B98A2E;
  --suite-blue: #2F5C8A;
  --suite-green: #3F6B4A;
  --suite-red: #AE3327;
  --suite-shadow: rgba(27, 42, 74, 0.08);
}

html.dark-theme, body.dark {
  --suite-bg: #111827;
  --suite-card: #1f2937;
  --suite-card-hover: #374151;
  --suite-ink: #f9fafb;
  --suite-ink-soft: #9ca3af;
  --suite-line: #374151;
  --suite-gold: #fbbf24;
  --suite-blue: #60a5fa;
  --suite-green: #34d399;
  --suite-red: #f87171;
  --suite-shadow: rgba(0, 0, 0, 0.4);
}

.suite-hub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--suite-card, #F7F5EE);
  border: 1.5px solid var(--suite-ink, #1B2A4A);
  border-radius: 10px;
  padding: 8px 14px;
  margin-bottom: 16px;
  box-shadow: 0 4px 12px var(--suite-shadow, rgba(27,42,74,0.08));
  flex-wrap: wrap;
  width: 100%;
  box-sizing: border-box;
}
.suite-brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Fjalla One', sans-serif;
  font-size: 14px;
  letter-spacing: 0.5px;
  color: var(--suite-ink, #1B2A4A);
}
.suite-nav-links {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  flex: 1;
}
.suite-link {
  text-decoration: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--suite-line, #cdc7b2);
  background: var(--suite-bg, #EDEAE1);
  color: var(--suite-ink, #1B2A4A);
  transition: all 0.2s ease;
  white-space: nowrap;
}
.suite-link:hover {
  background: var(--suite-card-hover, #fff);
  border-color: var(--suite-gold, #B98A2E);
}
.suite-link.active {
  background: var(--suite-ink, #1B2A4A) !important;
  color: #ffffff !important;
  border-color: var(--suite-ink, #1B2A4A) !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.suite-hub-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.suite-btn-theme {
  background: var(--suite-bg, #EDEAE1);
  color: var(--suite-ink, #1B2A4A);
  border: 1.5px solid var(--suite-ink, #1B2A4A);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.suite-btn-theme:active { transform: scale(0.92); }


  /* Global Modern UI Additions */
  body {
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .stage {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    border: 1px solid var(--line);
    padding: 24px;
    margin-top: 10px;
    transition: box-shadow 0.3s ease;
  }
  body.dark .stage {
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
  }
  button {
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, background-color 0.2s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  button:active:not(:disabled) {
    transform: translateY(0);
  }
  input[type="text"], input[type="password"], textarea, select {
    border-radius: 8px;
    border: 1px solid var(--line);
    padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--paper);
    color: var(--ink);
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
  /* Modern Flashcards */
  .flashcard {
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      transition: transform 0.4s ease;
  }
  .flashcard:hover {
      transform: translateY(-5px);
  }

<script>

/* ---- Restored after shared-file refactor: referenced but never (re)defined ---- */
// B1 includes the textbook lessons (formerly B1.1/B1.2, see srcLevel); some A1-C1 levels are word-frequency estimates (levelEst).
const NOUN_LEVELS = [{k:'alle',l:'Alle'},{k:'A1',l:'A1'},{k:'A2',l:'A2'},{k:'B1',l:'B1'},{k:'B2',l:'B2'},{k:'C1',l:'C1'}];
const NOUN_TYPES = [{k:'alle',l:'Alle',dot:null},{k:'en',l:'-en/-n',dot:'dot-en'},{k:'e',l:'-e',dot:'dot-e'},
  {k:'er',l:'-er',dot:'dot-er'},{k:'s',l:'-s',dot:'dot-s'},{k:'unchanged',l:'unverändert',dot:'dot-unchanged'},
  {k:'umlaut_only',l:'nur Umlaut',dot:'dot-umlaut_only'}];
const ADJ_SOURCES = [{k:'alle',l:'Alle'},{k:'Einfach gut! B1',l:'Einfach gut!'},{k:'Auf jeden Fall!',l:'Auf jeden Fall!'},{k:'General A1 Vocabulary',l:'General A1'}];
const ADJ_TYPES = [{k:'alle',l:'Alle',dot:null},{k:'regular',l:'Regelmäßig',dot:'dot-regular'},
  {k:'umlaut',l:'Umlaut',dot:'dot-umlaut'},{k:'irregular',l:'Unregelmäßig',dot:'dot-irregular'}];

function meaningHTML(v){
  if(meaningLang==='ta'){
    return v.ta ? `<div class="meaningbox"><div class="ta">${v.ta}<span class="translit">${v.ta_translit}</span></div></div>`
                : `<div class="meaningbox"><div class="en">${v.en}</div></div>`;

function analyzeNoun(v) {

  } else if (sgLower.endsWith('heit')) {
    genderRule = '🔴 <b>-heit → DIE:</b> 100% feminine suffix for states and qualities (e.g. <i>die Gesundheit, die Freiheit, die Wahrheit</i>).';
  } else if (sgLower.endsWith('keit')) {
    genderRule = '🔴 <b>-keit → DIE:</b> 100% feminine suffix for abstract properties and abilities (e.g. <i>die Möglichkeit, die Pünktlichkeit</i>).';
  } else if (sgLower.endsWith('schaft')) {
    genderRule = '🔴 <b>-schaft → DIE:</b> 100% feminine suffix for collectives and relations (e.g. <i>die Freundschaft, die Mannschaft</i>).';
  } else if (sgLower.endsWith('tion') || sgLower.endsWith('sion') || sgLower.endsWith('ion')) {
    genderRule = '🔴 <b>-ion / -tion → DIE:</b> 100% feminine Latin loan suffix (e.g. <i>die Station, die Information, die Diskussion</i>).';

    genderRule = '🔴 <b>-tät → DIE:</b> 100% feminine suffix for qualities and institutions (e.g. <i>die Universität, die Qualität</i>).';
  } else if (sgLower.endsWith('ik')) {
    genderRule = '🔴 <b>-ik → DIE:</b> Feminine suffix for fields, arts, and systems (e.g. <i>die Musik, die Politik, die Grammatik</i>).';
  } else if (sgLower.endsWith('in') && (art === 'die')) {
    genderRule = '🔴 <b>-in → DIE:</b> Feminine suffix for female professions and persons (e.g. <i>die Kollegin, die Ärztin, die Lehrerin</i>).';
  } else if (sgLower.endsWith('ei') || sgLower.endsWith('erei')) {

  } else if (sgLower.endsWith('ling')) {
    genderRule = '🔵 <b>-ling → DER:</b> 100% masculine suffix for persons and living things (e.g. <i>der Schmetterling, der Lehrling, der Frühling</i>).';

  } else if ((sgLower.endsWith('ant') || sgLower.endsWith('ent')) && art === 'der') {
    genderRule = '🔵 <b>-ant / -ent → DER:</b> Masculine person suffix (e.g. <i>der Praktikant, der Assistent, der Student</i>).';
  } else if (art === 'die' && sgLower.endsWith('e')) {
    genderRule = '🔴 <b>Useful Feminine Rule:</b> Many German nouns ending in <i>-e</i> are feminine, so <b>DIE</b> is a useful first guess (e.g. <i>die Zone, die Straße, die Lampe, die Schule</i>) — though there are exceptions (e.g. <i>der Name, der Junge, das Auge, das Ende</i>).';

    punch = directMnemonic.punch;
  } else if (wordBreakdown.length >= 2) {
    mentalImage = 'Deconstruct the compound: ' + wordBreakdown.join(' + ') + '. Picture the composite concept clearly to reconstruct the word!';
    emojiScene = '🧩 ' + wordBreakdown.map(b => b.split(' ')[0]).join(' + ') + ' → ' + art.toUpperCase() + ' ' + sg;
    punch = art.toUpperCase() + ' + ' + (breakdownEn || sg.toUpperCase()) + ' → ' + art + ' ' + sg;
  } else {
    mentalImage = 'Picture ' + en + ' (' + ta + ') vividly with ' + (art === 'der' ? 'a blue masculine anchor (DER)' : art === 'die' ? 'a red feminine anchor (DIE)' : 'a green neuter anchor (DAS)') + '.';
    emojiScene = (art === 'der' ? '🔵' : art === 'die' ? '🔴' : '🟢') + ' ' + sg + ' → ' + en;
    punch = art.toUpperCase() + ' + ' + sg.toUpperCase() + ' → ' + art + ' ' + sg;
  }

  return {
    sg: sg,
    art: art,
    artUpper: art.toUpperCase(),
    pl: pl,
    en: en,
    ta: ta,
    genderClass: genderClass,
    genderRule: genderRule,
    pluralPattern: pluralPattern,
    pluralTrick: pluralTrick,
    umlautStatus: umlautStatus,
    wordBreakdown: wordBreakdown,
    breakdownEn: breakdownEn,
    mentalImage: mentalImage,
    emojiScene: emojiScene,
    punch: punch
  };
}

function getCheatCodesForWord(w, cat, opt = {}) {
  const word = (w || '').trim();
  const lower = word.toLowerCase();
  const rawWord = lower.replace(/^sich\s+/, '').replace(/^(der|die|das)\s+/, '');
  const hints = [];

  // NOUN CHEAT CODES
  if (cat === 'n' || opt.art || ['der', 'die', 'das'].includes(opt.art)) {
    const art = opt.art || (word.startsWith('der ') ? 'der' : word.startsWith('die ') ? 'die' : word.startsWith('das ') ? 'das' : '');
    const femSuffixes = ['ung', 'heit', 'keit', 'schaft', 'tion', 'tät', 'in', 'ik', 'ur', 'ei', 'ade', 'anz', 'enz'];
    const neutSuffixes = ['chen', 'lein', 'ment', 'um', 'tum', 'ma'];
    const mascSuffixes = ['ismus', 'ist', 'or', 'ling', 'ant', 'ent', 'eur', 'ich', 'ig'];

    const matchedFem = femSuffixes.find(s => rawWord.endsWith(s));
    const matchedNeut = neutSuffixes.find(s => rawWord.endsWith(s));
    const matchedMasc = mascSuffixes.find(s => rawWord.endsWith(s));

    if (matchedFem) {
      hints.push({
        num: 'Shortcut 11',
        title: `🔴 100% Feminine Suffix Lock: -${matchedFem} → DIE`,
        badge: '100% Accurate DIE',
        rule: `Nouns ending in <b>-${matchedFem}</b> are <b>100% FEMININE (die)</b>. Plural rule: always adds <b>-${matchedFem === 'in' ? 'nen' : 'en'}</b> (e.g. <i>die ${rawWord} → die ${rawWord}${matchedFem === 'in' ? 'nen' : 'en'}</i>).`,
        tamil: `💡 <b>Suffix Lock:</b> -${matchedFem} என முடிந்தால் 100% 'die' (பெண்பால்)! பன்மைக்கு -${matchedFem === 'in' ? 'nen' : 'en'} சேர்க்கவும்.`
      });
    } else if (matchedNeut) {
      hints.push({
        num: 'Shortcut 11',
        title: `🟢 100% Neuter Suffix Lock: -${matchedNeut} → DAS`,
        badge: '100% Accurate DAS',
        rule: `Nouns ending in <b>-${matchedNeut}</b> are <b>100% NEUTER (das)</b>. Diminutives like <i>-chen / -lein</i> have NO plural ending change.`,
        tamil: `💡 <b>Suffix Lock:</b> -${matchedNeut} என முடிந்தால் 100% 'das' (ஒன்றன்பால்)!`
      });
    } else if (matchedMasc) {
      hints.push({
        num: 'Shortcut 11',
        title: `🔵 95% Masculine Suffix Lock: -${matchedMasc} → DER`,
        badge: '95% Accurate DER',
        rule: `Nouns ending in <b>-${matchedMasc}</b> are <b>95% MASCULINE (der)</b>.`,
        tamil: `💡 <b>Suffix Lock:</b> -${matchedMasc} என முடிந்தால் 95% 'der' (ஆண்பால்)!`
      });
    }

    if (rawWord.length > 8 && !matchedFem && !matchedNeut && !matchedMasc) {
      hints.push({
        num: 'Shortcut 12',
        title: '🧩 The Last-Word Captain Rule (Compound Nouns)',
        badge: 'Gender Anchor',
        rule: `In compound nouns, the <b>very last word component</b> determines the gender and plural with 100% authority!`,
        tamil: '💡 <b>Compound Hack:</b> கூட்டுப் பெயர்களில் கடைசி சொல்லே Article மற்றும் Plural-ஐ தீர்மானிக்கும்!'
      });
    }

    if (art === 'die' && !matchedFem) {
      hints.push({
        num: 'Shortcut 13',
        title: '📦 Feminine Plural Default: -(e)n',
        badge: '95% Plural Rule',
        rule: '95% of feminine German nouns take <b>-(e)n</b> in the plural (e.g. <i>die Sprache → die Sprachen, die Frau → die Frauen</i>).',
        tamil: '💡 <b>Plural Hack:</b> \'die\' பெயர்ச்சொற்கள் 95% பன்மையில் -(e)n பெறும்!'
      });
    } else if (art === 'der' && !matchedMasc) {
      hints.push({
        num: 'Shortcut 13',
        title: '📦 Masculine Plural Default: -e + Umlaut',
        badge: '80% Plural Rule',
        rule: 'Most masculine nouns form plurals with <b>-e</b>, often adding an Umlaut on a/o/u (e.g. <i>der Stuhl → die Stühle, der Tag → die Tage</i>). Doer nouns in <i>-er</i> keep the same form (<i>der Lehrer → die Lehrer</i>).',
        tamil: '💡 <b>Plural Hack:</b> \'der\' பெயர்ச்சொற்கள் பெரும்பாலும் -e மற்றும் Umlaut பெறும்!'
      });
    } else if (art === 'das' && !matchedNeut) {
      hints.push({
        num: 'Shortcut 13',
        title: '📦 Neuter Plural Default: -er + Umlaut or -e',
        badge: 'Neuter Plural Rule',
        rule: 'Monosyllabic neuter nouns typically take <b>-er + Umlaut</b> in plural (e.g. <i>das Haus → die Häuser, das Kind → die Kinder, das Buch → die Bücher</i>).',
        tamil: '💡 <b>Plural Hack:</b> ஓரசை \'das\' சொற்கள் பன்மையில் -er + Umlaut பெறும்!'
      });
    }
  }

  // ADJECTIVE CHEAT CODES
  if (cat === 'adj') {
    const umlautAdjs = ['alt', 'jung', 'groß', 'klein', 'warm', 'kalt', 'stark', 'schwach', 'kurz', 'lang', 'klug', 'dumm', 'nah', 'hoch', 'hart', 'arm', 'scharf'];
    if (umlautAdjs.includes(rawWord)) {
      hints.push({
        num: 'Shortcut 27',
        title: '⚡ 1-Syllable Comparative Umlaut Rule (a, o, u → ä, ö, ü)',
        badge: 'Comparative Umlaut',
        rule: `Short 1-syllable adjectives with <b>a, o, u</b> almost always get an <b>Umlaut</b> in Comparative & Superlative (e.g. <i>${rawWord} → ${rawWord.replace('a','ä').replace('o','ö').replace('u','ü')}er</i>).`,
        tamil: '💡 <b>Adjective Hack:</b> a, o, u உள்ள ஓரசை உரிச்சொற்கள் Comparative-ல் Umlaut (ä, ö, ü) பெறும்!'
      });
    }

    if (rawWord.endsWith('el') || rawWord.endsWith('er')) {
      hints.push({
        num: 'Shortcut 28',
        title: '✂️ The -el / -er Stem Contraction Rule',
        badge: 'Drop the -e-',
        rule: `Adjectives ending in <b>-el</b> (e.g. <i>dunkel, edel, flexibel</i>) drop the root <b>-e-</b> before adding comparative or adjective declension endings (<i>dunkel → dunkler / ein dunkles Zimmer</i>).`,
        tamil: '💡 <b>Contraction Hack:</b> -el முடிவடையும் Adjectives-ல் நடுவில் உள்ள \'e\' மறைந்துவிடும் (dunkel → dunkler)!'
      });
    }

    if (rawWord.endsWith('bar')) {
      hints.push({
        num: 'Shortcut 29',
        title: '🧩 Adjective Suffix: -bar = "-able / Feasible"',
        badge: 'Word Building',
        rule: `<b>-bar</b> turns verbs into passive abilities (e.g. <i>machbar = doable, bezahlbar = affordable, sichtbar = visible</i>).`,
        tamil: '💡 <b>Meaning:</b> -bar = செய்யக்கூடிய (English: -able).'
      });
    } else if (rawWord.endsWith('los')) {
      hints.push({
        num: 'Shortcut 29',
        title: '🧩 Adjective Suffix: -los = "-less / Without"',
        badge: 'Word Building',
        rule: `<b>-los</b> indicates absence of something (e.g. <i>arbeitslos = jobless, kostenlos = free of charge, schlaflos = sleepless</i>).`,
        tamil: '💡 <b>Meaning:</b> -los = இல்லாத / அற்ற (English: -less).'
      });
    } else if (rawWord.endsWith('reich') || rawWord.endsWith('voll')) {
      hints.push({
        num: 'Shortcut 29',
        title: '🧩 Adjective Suffix: -reich / -voll = "Full of / Rich in"',
        badge: 'Word Building',
        rule: `<b>-reich / -voll</b> indicates abundance (e.g. <i>erfolgreich = successful, wertvoll = valuable, hilfreich = helpful</i>).`,
        tamil: '💡 <b>Meaning:</b> -reich / -voll = நிறைந்த / மிகுதியான.'
      });
    }
  }

  return hints;
}

function analyzeGermanLinguistics(w, cat, metadata = {}) {
  const word = (w || '').trim();
  const lower = word.toLowerCase().replace(/^(der|die|das)\s+/, '').replace(/^sich\s+/, '');
  const en = metadata.en || '';
  const ta = metadata.ta || '';

  const keys = Object.keys(COMPOUND_ROOTS_DB).sort((a,b) => b.length - a.length);
  let matchedParts = [];

  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (lower.startsWith(k)) {
      const rest = lower.slice(k.length);
      let glue = '';
      let cleanRest = rest;
      if (rest.startsWith('s') && rest.length > 2) { glue = 's'; cleanRest = rest.slice(1); }
      else if (rest.startsWith('en') && rest.length > 3) { glue = 'en'; cleanRest = rest.slice(2); }
      else if (rest.startsWith('n') && rest.length > 2) { glue = 'n'; cleanRest = rest.slice(1); }
      else if (rest.startsWith('e') && rest.length > 2) { glue = 'e'; cleanRest = rest.slice(1); }
      else if (rest.startsWith('er') && rest.length > 3) { glue = 'er'; cleanRest = rest.slice(2); }

      for (let j = 0; j < keys.length; j++) {
        const k2 = keys[j];
        if (cleanRest === k2 || cleanRest.startsWith(k2)) {
          matchedParts = [
            { raw: k, info: COMPOUND_ROOTS_DB[k] },
            { glue: glue },
            { raw: cleanRest, info: COMPOUND_ROOTS_DB[k2] || { de: cleanRest, en: cleanRest, ta: cleanRest } }
          ];
          break;
        }
      }
      if (matchedParts.length > 0) break;
    }
  }

  if (matchedParts.length === 0) {
    if (lower === 'handschuh') {
      matchedParts = [{ raw: 'hand', info: COMPOUND_ROOTS_DB['hand'] }, { glue: '' }, { raw: 'schuh', info: COMPOUND_ROOTS_DB['schuh'] }];
    } else if (lower === 'kühlschrank') {
      matchedParts = [{ raw: 'kühl', info: COMPOUND_ROOTS_DB['kühl'] }, { glue: '' }, { raw: 'schrank', info: COMPOUND_ROOTS_DB['schrank'] }];
    } else if (lower === 'wörterbuch') {
      matchedParts = [{ raw: 'wörter', info: COMPOUND_ROOTS_DB['wörter'] }, { glue: '' }, { raw: 'buch', info: COMPOUND_ROOTS_DB['buch'] }];
    } else if (lower === 'arbeitsplatz') {
      matchedParts = [{ raw: 'arbeit', info: COMPOUND_ROOTS_DB['arbeit'] }, { glue: 's' }, { raw: 'platz', info: COMPOUND_ROOTS_DB['platz'] }];
    } else if (lower === 'schweinefleisch') {
      matchedParts = [{ raw: 'schwein', info: COMPOUND_ROOTS_DB['schwein'] }, { glue: 'e' }, { raw: 'fleisch', info: COMPOUND_ROOTS_DB['fleisch'] }];
    } else if (lower === 'sonnenbrille') {
      matchedParts = [{ raw: 'sonne', info: COMPOUND_ROOTS_DB['sonne'] }, { glue: 'n' }, { raw: 'brille', info: COMPOUND_ROOTS_DB['brille'] }];
    } else if (lower === 'krankenhaus') {
      matchedParts = [{ raw: 'krank', info: COMPOUND_ROOTS_DB['krank'] }, { glue: 'en' }, { raw: 'haus', info: COMPOUND_ROOTS_DB['haus'] }];
    } else if (lower === 'kindergarten') {
      matchedParts = [{ raw: 'kind', info: COMPOUND_ROOTS_DB['kind'] }, { glue: 'er' }, { raw: 'garten', info: COMPOUND_ROOTS_DB['garten'] }];
    }
  }

  if (matchedParts.length >= 3) {
    const p1 = matchedParts[0];
    const glue = matchedParts[1].glue;
    const p2 = matchedParts[2];
    const rightBoss = p2.info ? p2.info.de : p2.raw;
    const rightBossEn = p2.info ? p2.info.en : p2.raw;
    const rightBossTa = p2.info ? p2.info.ta : '';

    const p1De = p1.info ? p1.info.de : p1.raw;
    const p1En = p1.info ? p1.info.en : p1.raw;
    const p1Ta = p1.info ? p1.info.ta : '';

    const splittingStr = glue 
      ? `${p1De} + <b style="color:var(--stamp-red); background:#fef2f2; padding:0 3px; border-radius:3px;">${glue}</b> (glue) + <b>${rightBoss}</b> 👑` 
      : `${p1De} + <b>${rightBoss}</b> 👑`;
    
    const literalStr = `${p1En} + ${rightBossEn}`;
    const actualStr = `${en || word} ${ta ? `(${ta})` : ''}`;

    return {
      type: 'compound_noun',
      word: word,
      p1: p1De,
      p1En: p1En,
      p1Ta: p1Ta,
      glue: glue,
      rightBoss: rightBoss,
      rightBossEn: rightBossEn,
      rightBossTa: rightBossTa,
      splitting: splittingStr,
      literal: literalStr,
      actual: actualStr,
      title: '👑 1. The "Right-Side Boss" Rule & 🔗 Glue Letters (Punarchi)',
      badge: 'Compound Word Boss',
      genderReason: `The very last word on the right (<b>${rightBoss}</b> = <i>${rightBossEn}</i>) is the <b>Boss</b>! It dictates the gender (<b>${metadata.art || metadata.a || 'der/die/das'}</b>) and main category. Everything to the left (<b>${p1De}</b>) just describes it.`,
      punarchiExpl: glue ? `
        <div style="margin-top:6px; background:#fff; border:1px solid #fae8b4; border-left:3px solid var(--gold); padding:8px 10px; border-radius:4px;">
          <b>🔗 2. "Glue Letters" (The German Punarchi / ஜெர்மன் புணர்ச்சி):</b><br>
          In Tamil, when joining words (புணர்ச்சி), extra letters appear for smooth flow (like <i>க், ச், த், ப்</i> — e.g. <i>தமிழ் + தாய் = தமிழ்த்தாய்</i>).<br>
          German does the exact same thing by inserting the glue letter <b>„-${glue}-”</b> (Fugenlaut):<br>
          ↳ <b>${p1De}</b> + <b style="color:var(--stamp-red); background:#fef2f2; padding:1px 4px; border-radius:3px;">-${glue}-</b> + <b>${rightBoss}</b> = <b>${word}</b>!
        </div>
      ` : ''
    };
  }

  return null;
}

function renderAdjMemoryHack(v){
  const w = (v.w||'').toLowerCase();
  let umlautRule = '';
  let irregularRule = '';
  let suffixRule = '';

  // Irregular Top 5
  if(w === 'gut'){
    irregularRule = `⭐ <b>Top Irregular (English Cousin):</b> <i>gut → besser → am besten</i> (Good → Better → Best). Same root pattern as English!`;
  } else if(w === 'viel'){
    irregularRule = `⭐ <b>Top Irregular (English Cousin):</b> <i>viel → mehr → am meisten</i> (Much → More → Most). Direct cognate to English!`;
  } else if(w === 'gern' || w === 'gerne'){
    irregularRule = `⭐ <b>Top Irregular:</b> <i>gern → lieber → am liebsten</i> (Gladly → Rather → Favorite/Most gladly). Essential for speaking!`;
  } else if(w === 'hoch'){
    irregularRule = `⭐ <b>Spelling Shift Trick:</b> <i>hoch → höher → am höchsten</i>. Note: The letter <b>'c' drops out</b> in comparative (<i>höher</i>), but returns in superlative (<i>am höchsten</i>)!`;
  } else if(w === 'nah'){
    irregularRule = `⭐ <b>Spelling Shift Trick:</b> <i>nah → näher → am nächsten</i>. Note: 'h' transforms into 'ch' in superlative (<i>nächste Woche</i> = next week)!`;
  } else if(w === 'teuer' || w === 'dunkel' || w === 'sauer'){
    irregularRule = `⭐ <b>Vowel Drop Trick:</b> The inner <b>-e-</b> drops out (<i>${w} → ${v.komp}</i>) to keep pronunciation smooth and flowing!`;
  }

  // Umlaut Rule
  if(v.typ === 'umlaut'){
    umlautRule = `⚡ <b>Umlaut Law:</b> Short, 1-syllable adjectives with <b>a, o, u</b> (<i>alt, groß, kurz, jung, kalt, warm, stark, lang</i>) explode with umlaut dots in comparative: <b>${v.w} → ${v.komp} → ${v.sup}</b>!`;
  }

  // Suffix Decoders
  if(w.endsWith('bar')){
    suffixRule = `🔍 <b>Suffix Decoder (-bar):</b> Equals English <b>-able / -ible</b> (e.g. <i>${v.w}</i> = able to be done)!`;
  } else if(w.endsWith('los')){
    suffixRule = `🔍 <b>Suffix Decoder (-los):</b> Equals English <b>-less / without</b> (e.g. <i>${v.w}</i> = without)!`;
  } else if(w.endsWith('reich') || w.endsWith('voll')){
    suffixRule = `🔍 <b>Suffix Decoder (-reich/-voll):</b> Equals <b>full of / rich in</b>!`;
  } else if(w.endsWith('lich')){
    suffixRule = `🔍 <b>Suffix Decoder (-lich):</b> Equals English <b>-ly / -like</b> (manner/frequency)!`;
  }

  let baseTip = `💡 <b>Comparison Formula:</b> Positive (<i>${v.w}</i>) → Comparative (+<b>-er</b>: <i>${v.komp}</i>) → Superlative (<b>am ...-(e)sten</b>: <i>${v.sup}</i>). Meaning: <i>„${v.en}”</i> ${v.ta ? `(${v.ta})` : ''}.`;

  return `
    <div class="morph-box">
      <div class="morph-header">
        <span>📐 Adjective Memory Trick &amp; Rules</span>
        <span style="font-size:10px; font-family:'IBM Plex Mono',monospace; opacity:0.8;">Comparison Hack</span>
      </div>
      <div class="morph-mnemonic">
        ${irregularRule ? `<div style="margin-bottom:6px; color:#991b1b;">${irregularRule}</div>` : ''}
        ${umlautRule ? `<div style="margin-bottom:6px; color:#1e40af;">${umlautRule}</div>` : ''}
        ${suffixRule ? `<div style="margin-bottom:6px; color:#065f46;">${suffixRule}</div>` : ''}
        ${renderCheatCodesHTML(v, 'adj')}
        <div style="font-size:11.5px; opacity:0.9;">${baseTip}</div>
      </div>
    </div>
  `;
}

function ruleExplanationNoun(v){
  const map = {
    en: `<b>Rule: -en/-n.</b> Very common for feminine nouns. Simply add -en (or just -n after -e), no umlaut.`,
    e: `<b>Rule: -e.</b> Common for masculine/neuter nouns, often with an additional umlaut on the stem vowel.`,
    er: `<b>Rule: -er.</b> Mostly neuter nouns; the stem vowel (a/o/u) almost always takes an umlaut.`,
    s: `<b>Rule: -s.</b> Typical for foreign words/Anglicisms — no ending change, no umlaut, just add -s.`,
    unchanged: `<b>Rule: unchanged.</b> Masculine/neuter nouns ending in -er, -en, -el, -chen, -lein remain identical in plural (only the article becomes "die").`,
    umlaut_only: `<b>Rule: umlaut only.</b> No ending — only the stem vowel changes (a→ä, o→ö, u→ü).`,
  };
  return `<div class="rulebox ${v.typ}">${map[v.typ]||''}</div>`;
}

function ruleExplanationAdj(v){
  const map = {
    regular: `<b>Rule: Regular.</b> Stem + <b>-er</b> (Comparative), <b>am</b> + Stem + <b>-(e)sten</b> (Superlative) — an -e- is inserted for stems ending in d/t/s/ß/z/sch.`,
    umlaut: `<b>Rule: Umlaut.</b> Short, single-syllable adjective with a/o/u — the stem vowel umlauts in both comparison forms (a→ä, o→ö, u→ü).`,
    irregular: `<b>Rule: Irregular.</b> A small closed group with completely unique forms — must be memorized.`,
  };
  return `<div class="rulebox ${v.typ}">${map[v.typ]||''}</div>`;
}

/* ---- diff highlight ---- */
function diffHighlight(a, b){
  a = a || ''; b = b || '';
  let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++;
  let j=0; while(j<a.length-i && j<b.length-i && a[a.length-1-j]===b[b.length-1-j]) j++;
  const aMid=a.slice(i,a.length-j), bMid=b.slice(i,b.length-j);
  const wrap=(s)=> s?`<span class="diffchar">${s}</span>`:'';
  return { a: a.slice(0,i)+wrap(aMid)+a.slice(a.length-j), b: b.slice(0,i)+wrap(bMid)+b.slice(b.length-j) };
}

  function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} 
return a; }
  function buildQueue(p, limit){
    limit = limit || 20;
    const used = {}; const out = [];
    function add(list, cap){
      let n=0;
      for(const v of list){
        if(used[v.uid]) continue;
        if(cap!==undefined && n>=cap) break;
        out.push(v); used[v.uid]=true; n++;
        if(out.length>=limit) return;
      }
    }
    const overdue = p.filter(v=>!isNew(v.uid) && isDue(v.uid)).sort((a,b)=>(PROGRESS[a.uid].nextDue).localeCompare(PROGRESS[b.uid].nextDue));
    add(overdue);
    if(out.length<limit){ const diff = p.filter(v=>isDifficult(v.uid)).sort((a,b)=>PROGRESS[b.uid].timesWrong-PROGRESS[a.uid].timesWrong); 
add(diff); }
    if(out.length<limit){ const recent = p.filter(v=>!isNew(v.uid) && PROGRESS[v.uid].box<=2); add(recent); }
    if(out.length<limit){ add(shuffleArr(p.filter(v=>isNew(v.uid))), Math.max(4, Math.floor(limit*0.5))); }
    if(out.length<limit){ add(shuffleArr(p.filter(v=>isMastered(v.uid))), 3); }
    if(out.length<limit){ add(shuffleArr(p)); }
    return shuffleArr(out);
  }

/* ---- EASY MODE: multiple-choice recognition ---- */
function pickDistractors(v, count){
  const source = pool().length >= count+1 ? pool() : (curMode==='nomen' ? NOUNS : ADJS);
  const others = source.filter(x => x.uid !== v.uid);
  return shuffleArr(others).slice(0, count);
}

function renderEasyMC(v){
  const stage = document.getElementById('stage');
  const reverse = (curDir === 'en2de');
  const isGenderMode = (curMode === 'nomen' && curDir === 'gender');

  let promptText, correctText, optionTexts;
  if(isGenderMode){
    promptText = v.sg;
    correctText = v.a;
    optionTexts = shuffleArr(['der','die','das']);
  } else {
    const distractors = pickDistractors(v, 3);
    if(curMode === 'nomen'){
      promptText = reverse ? meaningPromptText(v) : `${v.a} ${v.sg}`;
      correctText = reverse ? `${v.a} ${v.sg}` : meaningPromptText(v);
      optionTexts = shuffleArr([correctText, ...distractors.map(d => reverse ? `${d.a} ${d.sg}` : meaningPromptText(d))]);
    } else {
      promptText = reverse ? meaningPromptText(v) : v.w;
      correctText = reverse ? v.w : meaningPromptText(v);
      optionTexts = shuffleArr([correctText, ...distractors.map(d => reverse ? d.w : meaningPromptText(d))]);
    }
  }

  stage.innerHTML = `
    ${modeSelectorHTML()}
    ${showAnswerToggleHTML()}
    <div class="sessionbar" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
      <span>Practice — Card ${sessionIdx+1} / ${session.length}</span>
      ${!isGenderMode ? `<div class="quick-card-tools">
        ${typeof dcAudioToggleHTML === 'function' ? dcAudioToggleHTML() : ''}<button class="quick-tool-btn" onclick="flipDirection()" title="Flip Direction">⇄ ${reverse?'Meaning → DE':'DE → Meaning'}</button></div>` : ''}
    </div>
    <div class="studycard">
      <div class="stripe ${v.typ}"></div>
      <div class="meta"><span>${curMode==='nomen' ? v.level : v.source}</span></div>
      <div class="prompt">
        <div class="wordicon">${getIcon(v)}</div>
        <div class="word" style="font-size:22px; font-weight:700;">${promptText}</div>
        <div class="subq" style="margin-top:10px;">${isGenderMode ? 'Welcher Artikel?' : (reverse ? `Pick the correct German ${curMode==='nomen'?'noun':'adjective'}` : 'Pick the correct meaning')}</div>
      </div>
      <div class="opt-grid" style="display:grid; gap:8px; padding:0 18px 18px;">
        ${optionTexts.map((opt,i)=>`
          <button class="opt-btn" id="mcOpt_${i}" style="padding:12px; border-radius:8px; border:1.5px solid var(--line); background:#fff; cursor:pointer; text-align:left; font-size:14px;" onclick="checkEasyMC(${i})">${opt}</button>
        `).join('')}
      </div>
      <div id="mcFeedback" style="display:none; padding:0 18px 18px;"></div>
    </div>
  `;
  window._mcState = { v, correctText, optionTexts };
}

function checkEasyMC(idx){
  const { v, correctText, optionTexts } = window._mcState;
  const chosen = optionTexts[idx];
  const isCorrect = chosen === correctText;
  document.querySelectorAll('.opt-btn').forEach((btn,i) => {
    btn.disabled = true;
    if(optionTexts[i] === correctText) btn.style.cssText += 'background:#E2EED8; border-color:var(--green);';
    else if(i === idx) btn.style.cssText += 'background:#F8E4E3; border-color:var(--red);';

  const stage = document.getElementById('stage');
  const isNoun = (curMode === 'nomen');
  const task = isNoun
    ? `Type the noun WITH its correct article and plural, e.g. "der Tisch, die Tische".`
    : `Type the Comparative and Superlative forms, e.g. "schneller, am schnellsten".`;
  const wordDisp = isNoun ? `${v.a} ${v.sg}` : v.w;

  stage.innerHTML = `
    ${modeSelectorHTML()}
    ${showAnswerToggleHTML()}
    <div class="sessionbar" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
      <span>Practice — Card ${sessionIdx+1} / ${session.length}</span>
    </div>
    <div class="studycard">
      <div class="stripe ${v.typ}"></div>
      <div class="meta"><span>${isNoun ? v.level : v.source}</span></div>
      <div class="prompt">
        <div class="wordicon">${getIcon(v)}</div>
        <div class="word" style="font-size:22px; font-weight:700;">${wordDisp} <span style="font-size:13px; opacity:0.7;">(${meaningPromptText(v)})</span></div>
        <div class="subq" style="margin-top:10px;">${task}</div>
      </div>
      <div style="padding:0 18px 18px;">
        <input type="text" id="hardInput" class="challenge-input" placeholder="..." autofocus style="width:100%; padding:10px; border-radius:6px; border:1.5px solid var(--line); font-size:14px;">
        <button class="actbtn next-bold" style="margin-top:10px; background:var(--ink); color:#fff; padding:10px 16px;" onclick="checkHardProduction()">Verify ✓</button>
      </div>
      <div id="hardFeedback" style="display:none; padding:0 18px 18px;"></div>
    </div>
  `;
  document.getElementById('hardInput').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); checkHardProduction(); } });
  window._hardState = { v };
}

function checkHardProduction(){
  const { v } = window._hardState;
  const val = document.getElementById('hardInput').value.trim().toLowerCase();
  const isNoun = (curMode === 'nomen');
  let isCorrect, expectedLabel;
  if(isNoun){
    const plStem = (v.pl || '').toLowerCase().replace(/[()]/g,'');
    isCorrect = val.length >= 3 && val.includes((v.a||'').toLowerCase()) && (plStem === '—' || val.includes(plStem));
    expectedLabel = `${v.a} ${v.sg}, die ${v.pl}`;
  } else {
    const komp = (v.komp || '').toLowerCase();
    const sup = (v.sup || '').toLowerCase();
    isCorrect = val.length >= 3 && (!komp || val.includes(komp)) && (!sup || val.includes(sup));
    expectedLabel = `${v.komp}, am ${v.sup}`;
  }
  recordAnswer(v.uid, isCorrect);
  const fb = document.getElementById('hardFeedback');
  fb.style.display = 'block';
  fb.innerHTML = `
    <div style="padding:10px; border-radius:6px; background:${isCorrect?'#E2EED8':'#F8E4E3'}; margin-bottom:8px;">
      ${isCorrect ? '✅ Gut gemacht!' : '❌ Not quite — correct: <b>' + expectedLabel + '</b>'}
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="actbtn next-bold" style="background:var(--ink); color:#fff; padding:8px 14px;" onclick="advance()">→ Next (N)</button>
      ${!isCorrect ? aiWordHelpButtonHTML(v) : ''}
    </div>
    <div id="aiWordHelpBox" style="display:none; margin-top:8px; padding:8px; background:#fff; border:1px solid var(--line); border-radius:4px; font-size:12px;"></div>
  `;
}

/* ---- AI weak-spot follow-up: one fresh example sentence for a REAL,
   already-verified word (never invents new vocabulary). Offline-safe: only
   shown when AI is configured (body.ai-enabled, set by js/app-shell.js). ---- */
function aiWordHelpButtonHTML(v){
  if(!document.body.classList.contains('ai-enabled')) return '';
  return `<button class="actbtn" style="background:var(--purple, #6B4A8A); color:#fff; padding:8px 14px;" onclick="aiWordHelp('${v.uid.replace(/'/g,"\\'")}')">🤖 More Practice With This Word (AI)</button>`;
}

function aiWordHelp(uid){
  const isNoun = (curMode === 'nomen');
  const v = isNoun ? NOUNS.find(x => x.uid === uid) : ADJS.find(x => x.uid === uid);
  if(!v || typeof callAIHelper !== 'function') return;
  const wordDesc = isNoun ? `the noun "${v.a} ${v.sg}" (plural: die ${v.pl}; English: ${v.en})` : `the adjective "${v.w}" (comparative: ${v.komp}, superlative: ${v.sup}; English: ${v.en})`;
  const promptTxt = `I am learning German. Help me practice ${wordDesc}.
Write ONE natural German example sentence using this exact word, followed by its English translation on a new line. Keep it short (max 12 words) and encouraging. Do not introduce any other unfamiliar vocabulary.`;
  callAIHelper(promptTxt, (text) => {
    const box = document.getElementById('aiWordHelpBox');
    if(box){
      box.innerHTML = (text && !text.startsWith('AI Error') && !text.startsWith('Error connecting'))
        ? `<strong>🤖 Example:</strong><br>${text.replace(/\n/g,'<br>')}`
        : `⚠️ AI isn't available right now (check your AI key in Settings).`;
      box.style.display = 'block';
    }
  });
}

/* ---- Keyboard Shortcuts for Fast Learning ---- */
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;

  if (!session || session.length === 0) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      const startBtn = document.getElementById('startBtn');
      if (startBtn) startBtn.click();
    }
    return;
  }

  const revealBtn = document.getElementById('revealBtn');
  const btnNochmal = document.getElementById('btnNochmal');
  const btnGewusst = document.getElementById('btnGewusst');
  const btnEasy = document.getElementById('btnEasy');
  const v = session[sessionIdx];

  // T key: Toggle translation peek
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    e.stopPropagation();
    toggleInlinePeek();
    return;
  }

  // L key: Cycle language
  if (e.key === 'l' || e.key === 'L') {
    e.preventDefault();
    e.stopPropagation();
    cycleMeaningLang();
    return;
  }

  // N key: Next card immediately. Must stop propagation here - js/app-shell.js
  // also has a global window-level 'n' handler (shared across pages) that
  // looks for a ".actbtn.check"/".actbtn.next" button and, finding none on
  // this page (this page uses "next-bold" instead), falls back to clicking
  // #startReviewBtn and navigating away to deutsch-coach.html. Without
  // stopPropagation, BOTH handlers fired on every single "N" press.
  if (e.key === 'n' || e.key === 'N') {
    e.preventDefault();
    e.stopPropagation();
    advance();
    return;
  }

  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    e.stopPropagation();
    if (revealBtn && revealBtn.style.display !== 'none' && revealBtn.offsetParent !== null) {
      revealBtn.click();
    } else if (btnGewusst && btnGewusst.offsetParent !== null) {
      btnGewusst.click();
    }
    return;
  }

  if (e.key === '1' && btnNochmal && btnNochmal.offsetParent !== null) {
    e.preventDefault(); e.stopPropagation(); btnNochmal.click(); return;
  }
  if (e.key === '2' && btnGewusst && btnGewusst.offsetParent !== null) {
    e.preventDefault(); e.stopPropagation(); btnGewusst.click(); return;
  }
  if (e.key === '3' && btnEasy && btnEasy.offsetParent !== null) {
    e.preventDefault(); e.stopPropagation(); btnEasy.click(); return;
  }
  if (e.code === 'KeyS') {
    if (v) {
      e.preventDefault();
      e.stopPropagation();
      const txt = curMode === 'nomen' ? `${v.a} ${v.sg}` : v.w;
      speak(txt);
    }
  }
});

refreshAll();

// UNIFIED SUITE THEME SYSTEM
function initSuiteTheme() {
  const saved = localStorage.getItem('de_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved === 'dark' || (!saved && prefersDark);
  applyTheme(isDark);
}
function applyTheme(isDark) {
  if (isDark) {
    document.documentElement.classList.add('dark-theme');
    document.body.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark-theme');
    document.body.classList.remove('dark');
  }
  const btn = document.getElementById('themeToggleBtn') || document.getElementById('themeToggle');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}
function toggleSuiteTheme() {
  const isDarkNow = document.documentElement.classList.contains('dark-theme') || document.body.classList.contains('dark');
  const nextDark = !isDarkNow;
  localStorage.setItem('de_theme', nextDark ? 'dark' : 'light');
  applyTheme(nextDark);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSuiteTheme);
} else {
  initSuiteTheme();
}


// --- Swipe Gestures for Flashcards: swipe left = next card, swipe right = previous card ---
// (Not to be confused with the separate der/die/das "Swipe Game" further below, which uses
// swipe direction as the answer itself, not deck navigation.)
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  if (!e.target.closest('.studycard') || e.target.closest('input, textarea')) return;
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (!e.target.closest('.studycard') || e.target.closest('input, textarea')) return;
  handleSwipe(e.changedTouches[0].screenX - touchStartX, e.changedTouches[0].screenY - touchStartY);
}, {passive: true});
function handleSwipe(dx, dy) {
  const swipeThreshold = 50;
  if (Math.abs(dx) < swipeThreshold || Math.abs(dx) < Math.abs(dy) * 1.5) return; // too short, or mostly vertical scroll
  if (!session || session.length === 0) return;
  if (dx < 0) advance();
  else prevCard();
}

function getGenderClass(article) {
  if (article === "der") return "gender-der";
  if (article === "die") return "gender-die";
  if (article === "das") return "gender-das";
  return "";
}

// --- SWIPE GAME LOGIC ---
let swipeQueue = [];
let swipeScore = 0;
let currentCardEl = null;
let currentWordObj = null;
let isDragging = false;
let startX = 0, startY = 0, currentX = 0, currentY = 0;

function startSwipeGame() {
  document.getElementById('dashboardUI').style.display = 'none';
  document.getElementById('stageUI').style.display = 'none';
  document.getElementById('swipeGameUI').style.display = 'flex';
  
  swipeScore = 0;
  document.getElementById('swipeScore').textContent = swipeScore;
  
  // Prepare queue
  swipeQueue = [...NOUNS].filter(n => n.a).sort(() => Math.random() - 0.5);
  
  renderNextSwipeCard();
}

function exitSwipeGame() {
  document.getElementById('swipeGameUI').style.display = 'none';
  document.getElementById('dashboardUI').style.display = 'block';
}

function renderNextSwipeCard() {
  const container = document.getElementById('swipeCardContainer');
  container.innerHTML = '';
  
  if (swipeQueue.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding-top:100px; font-weight:bold; font-size:24px;">Game Over!<br>Score: ${swipeScore}</div>`;
    return;
  }
  
  currentWordObj = swipeQueue.pop();
  
  const card = document.createElement('div');
  card.className = 'swipe-card';
  card.style.cssText = `
    position: absolute; width: 100%; height: 100%; background: var(--card);
    border: 2px solid var(--ink); border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: grab; user-select: none; transition: transform 0.1s; transform-origin: 50% 100%;
  `;
  
  card.innerHTML = `
    <div style="font-size:42px; font-weight:bold; color:var(--ink); margin-bottom:12px; text-align:center;">${currentWordObj.sg}</div>
    <div style="font-size:18px; color:var(--ink-soft);">${currentWordObj.en || ""}</div>
    <div id="swipeFeedback" style="position:absolute; top:20px; font-weight:bold; font-size:24px; opacity:0; text-transform:uppercase; border:3px solid; padding:4px 12px; border-radius:8px;"></div>
  `;
  
  container.appendChild(card);
  currentCardEl = card;
  
  // Touch / Mouse Events
  card.addEventListener('mousedown', dragStart);
  card.addEventListener('touchstart', dragStart, {passive:false});
  
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('touchmove', dragMove, {passive:false});
  
  window.addEventListener('mouseup', dragEnd);
  window.addEventListener('touchend', dragEnd);
}

function dragStart(e) {
  if (e.type === 'touchstart') {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  } else {
    startX = e.clientX;
    startY = e.clientY;
  }
  isDragging = true;
  currentCardEl.style.transition = 'none';
}

function dragMove(e) {
  if (!isDragging) return;
  e.preventDefault();
  
  let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
  let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
  
  currentX = clientX - startX;
  currentY = clientY - startY;
  
  let rotate = currentX * 0.05;
  currentCardEl.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
  
  // Feedback
  const fb = document.getElementById('swipeFeedback');
  if (currentX < -50) { fb.textContent = "DIE"; fb.style.color = "var(--die)"; fb.style.borderColor = "var(--die)"; fb.style.opacity = Math.min(1, Math.abs(currentX)/100); }
  else if (currentX > 50) { fb.textContent = "DER"; fb.style.color = "var(--der)"; fb.style.borderColor = "var(--der)"; fb.style.opacity = Math.min(1, currentX/100); }
  else if (currentY < -50) { fb.textContent = "DAS"; fb.style.color = "var(--das)"; fb.style.borderColor = "var(--das)"; fb.style.opacity = Math.min(1, Math.abs(currentY)/100); }
  else { fb.style.opacity = 0; }
}

function dragEnd(e) {
  if (!isDragging) return;
  isDragging = false;
  
  window.removeEventListener('mousemove', dragMove);
  window.removeEventListener('touchmove', dragMove);
  window.removeEventListener('mouseup', dragEnd);
  window.removeEventListener('touchend', dragEnd);
  
  const threshold = 80;
  let answer = null;
  
  if (currentX < -threshold) answer = 'die';
  else if (currentX > threshold) answer = 'der';
  else if (currentY < -threshold) answer = 'das';
  
  if (answer) {
    processSwipe(answer);
  } else {
    // Reset
    currentCardEl.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    currentCardEl.style.transform = `translate(0px, 0px) rotate(0deg)`;
    document.getElementById('swipeFeedback').style.opacity = 0;
  }
  currentX = 0; currentY = 0;
}

function simulateSwipe(dir) {
  if(!currentCardEl) return;
  processSwipe(dir, true);
}

function processSwipe(answer, isSimulated = false) {
  const correct = currentWordObj.a === answer;
  
  currentCardEl.style.transition = 'transform 0.4s ease-out, opacity 0.4s';
  
  let endX = 0, endY = 0;
  if(answer === 'die') endX = -500;
  else if(answer === 'der') endX = 500;
  else if(answer === 'das') endY = -500;
  
  currentCardEl.style.transform = `translate(${endX}px, ${endY}px) rotate(${endX*0.1}deg)`;
  currentCardEl.style.opacity = 0;
  
  if(correct) {
    swipeScore++;
    document.getElementById('swipeScore').textContent = swipeScore;
    // Tiny confetti effect could go here
  } else {
    // Flash red or show error briefly
    swipeScore = Math.max(0, swipeScore - 1);
    document.getElementById('swipeScore').textContent = swipeScore;
    alert(`Falsch! Es ist: ${currentWordObj.a} ${currentWordObj.sg}`);
  }
  
  setTimeout(() => {
    renderNextSwipeCard();
  }, 400);
}
