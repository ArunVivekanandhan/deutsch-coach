name: checks

# Runs the same checks a contributor runs locally (see PROJECT_KNOWLEDGE.md):
# word-list consistency, generated files up to date, and every page loading without JavaScript errors.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tools
        run: |
          sudo apt-get update -q
          pip install pyphen playwright
          python -m playwright install --with-deps chromium
      - name: Data checks (scripts/build.py)
        run: python scripts/build.py
      - name: Every page loads without JavaScript errors
        run: python scripts/smoke_pages.py
      - name: Video-call end-to-end tests (scripts/test_call.py, mocked providers)
        run: python scripts/test_call.py
