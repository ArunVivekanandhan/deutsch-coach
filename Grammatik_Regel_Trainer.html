<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<link rel="manifest" href="manifest.json">
<title>German Grammar &amp; Rules Trainer — Dein Deutsch-Coach</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  
  :root{
    --paper:#EDEAE1; --paper-dark:#E1DDCF; --card:#F7F5EE; --ink:#1B2A4A; --ink-soft:#4A5878;
    --red:#AE3327; --red-dark:#8A281F; --gold:#B98A2E; --green:#3F6B4A; --blue:#2F5C8A;
    --purple:#6B4A8A; --line:#cdc7b2; --shadow:rgba(27,42,74,0.18);
  }
  [data-theme="dark"] {
    --paper: #121212; --paper-dark: #1E1E1E; --card: #1E1E1E; --ink: #E0E0E0; --ink-soft: #A0A0A0;
    --red: #FF6B6B; --red-dark: #FF4F4F; --gold: #FFD93D; --green: #6BCB77; --blue: #4D96FF;
    --purple: #B590CA; --line: #333333; --shadow: rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}

  /* legacy body removed */
  .wrap{width:100%; max-width:780px;}

  /* Header & Navigation Suite Hub */
  .hub-banner{
    background:var(--card); border:1.5px solid var(--ink); border-radius:8px;
    padding:8px 12px; margin-bottom:12px; display:flex; justify-content:space-between;
    align-items:center; flex-wrap:wrap; gap:8px; box-shadow:0 4px 10px var(--shadow);
  }
  .hub-title{font-family:'Fjalla One',sans-serif; font-size:14px; display:flex; align-items:center; gap:6px;}
  .hub-links{display:flex; gap:6px; flex-wrap:wrap;}
  .hub-link{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 8px; border-radius:4px;
    text-decoration:none; color:var(--ink); background:var(--paper); border:1px solid var(--line);
    transition:all .15s; font-weight:600;
  }
  .hub-link:hover, .hub-link.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  h1{font-family:'Fjalla One',sans-serif; font-size:24px; border-bottom:3px solid var(--ink); padding-bottom:6px; margin:0 0 4px;}
  .sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:14px;}

  /* Mode Tabs */
  .modetabs{display:flex; gap:6px; margin-bottom:14px;}
  .modetab{
    flex:1; font-family:'Fjalla One',sans-serif; font-size:14px; padding:10px 4px; text-align:center;
    border:1.5px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
    cursor:pointer; transition:all .15s;
  }
  .modetab.active{background:var(--ink); color:#fff;}

  /* Rule Selector Chips */
  .filterbox{
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px;
    margin-bottom:14px; box-shadow:0 6px 14px var(--shadow);
  }
  .filterlabel{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.6px; color:var(--ink-soft); margin-bottom:6px; font-weight:700;
  }
  .chiprow{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 10px; border:1.5px solid var(--line);
    background:var(--paper); border-radius:16px; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; gap:5px; transition:all .15s;
  }
  .chip.active{border-color:var(--ink); color:var(--ink); font-weight:600; background:#fff;}
  .chip .dot{width:8px; height:8px; border-radius:50%;}

  .subtab{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 12px; border:1.5px solid var(--line);
    background:var(--card); border-radius:16px; cursor:pointer; color:var(--ink-soft); font-weight:600;
    transition:all .15s;
  }
  .subtab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* Rule Explanation Card */
  .rule-card{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 24px var(--shadow); padding:16px; margin-bottom:16px;
  }
  .rule-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px dashed var(--line); padding-bottom:8px;}
  .rule-badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    padding:3px 8px; border-radius:4px; color:#fff; font-weight:600;
  }
  .rule-title{font-family:'Fjalla One',sans-serif; font-size:20px; color:var(--ink); margin:0;}
  .rule-summary{font-size:14px; line-height:1.6; margin-bottom:14px; color:var(--ink);}

  .formula-box{
    background:var(--paper-dark); border-left:4px solid var(--gold); border-radius:0 6px 6px 0;
    padding:10px 12px; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.6;
    margin-bottom:14px;
  }

  .table-box{overflow-x:auto; margin-bottom:14px;}
  .prep-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px; margin-top:8px;}
  .prep-tile{border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:grid; gap:2px; align-content:start; color:var(--ink);}
  .prep-tile svg{justify-self:center; color:#2563eb;}
  .prep-w{font-family:'Fjalla One',sans-serif; font-size:20px; text-align:center;} .prep-en{text-align:center; font-size:12.5px; color:#64748b;}
  .prep-ta{text-align:center; font-size:13px;} .prep-ex{font-size:12.5px; line-height:1.45; margin-top:3px;}
  .ta-bridge{border-radius:8px; padding:10px 12px; margin-bottom:10px; border:1px solid var(--line); border-left:4px solid #16a34a; background:#f0fdf4;}
  .ta-bridge.trap{border-left-color:#d97706; background:#fffbeb;}
  .ta-bridge .tb-h{font-weight:700; font-size:13.5px; margin-bottom:6px; color:var(--ink);}
  .ta-bridge .tb-row{display:grid; grid-template-columns:78px 1fr; gap:4px 10px; font-size:13.5px; line-height:1.5; align-items:baseline;}
  .ta-bridge .tb-row .lb{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; color:#64748b;}
  .ta-bridge .tb-ta{font-size:15px;} .ta-bridge .tb-gl{font-style:italic; color:#475569; font-size:12.5px;}
  .ta-bridge .tb-why{margin-top:6px; font-size:13px; line-height:1.55;} .ta-bridge .tb-whyta{margin-top:4px; font-size:13.5px; line-height:1.6; color:#1e293b;}
  .ta-bridge table.de-table{margin:4px 0 8px;}
  .ta-toggle{font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center; cursor:pointer;}
  .dark .ta-bridge, body[data-theme="dark"] .ta-bridge{background:rgba(22,163,74,.12);} .dark .ta-bridge.trap, body[data-theme="dark"] .ta-bridge.trap{background:rgba(217,119,6,.14);}
  .dark .ta-bridge .tb-whyta, body[data-theme="dark"] .ta-bridge .tb-whyta{color:inherit;}
  table.de-table{width:100%; border-collapse:collapse; font-size:12.5px; text-align:left;}
  table.de-table th{background:var(--ink); color:#fff; padding:6px 8px; font-family:'IBM Plex Mono',monospace; font-weight:600;}
  table.de-table td{padding:6px 8px; border-bottom:1px solid var(--line); background:#fff;}
  table.de-table tr:nth-child(even) td{background:var(--card);}

  .example-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .example-item{
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .example-de{font-size:14px; font-weight:600; color:var(--ink);}
  .example-en{font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-style:italic;}
  .speak-btn{
    background:none; border:1.5px solid var(--line); border-radius:50%; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
    flex-shrink:0; transition:all .15s;
  }
  .speak-btn:hover{background:var(--paper); border-color:var(--ink);}

  /* Drill Practice Area */
  .drill-card{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 24px var(--shadow); padding:18px; margin-bottom:14px;
  }
  .drill-meta{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
  }
  .drill-prompt{font-size:18px; line-height:1.6; margin-bottom:16px; font-weight:600;}
  .drill-gap{
    display:inline-block; border-bottom:2px dashed var(--red); padding:0 8px;
    min-width:60px; text-align:center; color:var(--red);
  }
  .drill-en{font-size:13px; color:var(--ink-soft); font-style:italic; margin-bottom:16px;}
  .opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .opt-btn{
    font-family:'IBM Plex Sans',sans-serif; font-size:14px; padding:12px; border:1.5px solid var(--ink);
    border-radius:6px; background:#fff; color:var(--ink); cursor:pointer; text-align:center;
    transition:all .15s; font-weight:600;
  }
  .opt-btn:hover{background:var(--paper-dark);}
  .opt-btn.correct{background:var(--green); color:#fff; border-color:var(--green);}
  .opt-btn.wrong{background:var(--red); color:#fff; border-color:var(--red);}
  .opt-btn:disabled{cursor:default; opacity:0.9;}

  /* Sentence Builder / Pick & Build Styles */
  .en-challenge-box{
    background:#fff; border:1.5px solid var(--ink); border-left:5px solid var(--blue);
    border-radius:6px; padding:12px 14px; margin-bottom:14px; box-shadow:0 2px 6px var(--shadow);
  }
  .en-badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700;
    color:var(--blue); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:4px;
  }
  .en-prompt-text{
    font-family:'IBM Plex Sans',sans-serif; font-size:16px; font-weight:600;
    color:var(--ink); line-height:1.4;
  }
  .buildarea{
    min-height:56px; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; align-content:flex-start;
    padding:10px; background:var(--paper-dark); border-radius:6px; margin-bottom:12px; border:2px dashed var(--line);
    transition:border-color .15s;
  }
  .buildarea .placeholder{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); padding:8px;}
  .wordchip{
    font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:600; padding:8px 14px; border-radius:20px;
    cursor:pointer; user-select:none; border:1.5px solid var(--ink); transition:all .15s;
  }
  .wordchip:hover{transform:translateY(-1px);}
  .wordchip.inbank{background:#fff; color:var(--ink); box-shadow:0 2px 4px var(--shadow);}
  .wordchip.inbank:hover{background:var(--card);}
  .wordchip.inbuild{background:var(--ink); color:#fff; box-shadow:0 2px 6px rgba(27,42,74,0.3);}
  .wordchip.inbuild:hover{background:var(--red); border-color:var(--red-dark);}
  .bankarea{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; min-height:46px;}
  .build-action-row{display:flex; gap:8px; margin-bottom:10px;}
  .actbtn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.4px;
    padding:10px 14px; border-radius:6px; cursor:pointer; border:1.5px solid var(--ink); font-weight:700;
    transition:all .15s;
  }
  .actbtn.reset{background:var(--paper); color:var(--ink-soft); border-color:var(--line);}
  .actbtn.reset:hover{background:var(--paper-dark); color:var(--ink);}
  .actbtn.check{background:var(--gold); color:#fff; border-color:#8a6a1e; flex:1;}
  .actbtn.check:hover{background:#9d7524;}

  .feedback-box{
    border-radius:6px; padding:12px; margin-top:12px; font-size:13px; line-height:1.6;
    display:none;
  }
  .feedback-box.correct{background:#E2EED8; border:1.5px solid var(--green); color:#214427;}
  .feedback-box.wrong{background:#F8E4E3; border:1.5px solid var(--red); color:#661B14;}
  .feedback-title{font-family:'Fjalla One',sans-serif; font-size:15px; margin-bottom:4px;}

  .bigbtn{
    width:100%; font-family:'Fjalla One',sans-serif; font-size:16px; padding:14px; border:none;
    border-radius:6px; background:var(--ink); color:#fff; cursor:pointer; text-align:center;
    box-shadow:0 4px 0 #0d1525; margin-top:12px;
  }
  .bigbtn:active{transform:translateY(2px); box-shadow:0 2px 0 #0d1525;}
  .bigbtn.secondary{background:var(--red); box-shadow:0 4px 0 var(--red-dark);}

  .stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; text-align:center; } @media (max-width: 480px) { .stats-row { grid-template-columns:repeat(2,1fr); } }
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px 4px;}
  .stat-num{font-family:'Fjalla One',sans-serif; font-size:20px; color:var(--red);}
  .stat-lbl{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--ink-soft); margin-top:2px;}

  table { width: 100%; max-width: 100%; border-collapse: collapse; overflow-x: auto; display: block; }
  @media (min-width: 600px) { table { display: table; } }
  

/* UNIFIED DEUTSCH-COACH SUITE THEME & HUB */
:root {
  --suite-bg: #EDEAE1;
  --suite-card: #F7F5EE;
  --suite-card-hover: #ffffff;
  --suite-ink: #1B2A4A;
  --suite-ink-soft: #4A5878;
  --suite-line: #cdc7b2;
  --suite-gold: #B98A2E;
  --suite-blue: #2F5C8A;
  --suite-green: #3F6B4A;
  --suite-red: #AE3327;
  --suite-shadow: rgba(27, 42, 74, 0.08);
}

html.dark-theme, body.dark {
  --suite-bg: #111827;
  --suite-card: #1f2937;
  --suite-card-hover: #374151;
  --suite-ink: #f9fafb;
  --suite-ink-soft: #9ca3af;
  --suite-line: #374151;
  --suite-gold: #fbbf24;
  --suite-blue: #60a5fa;
  --suite-green: #34d399;
  --suite-red: #f87171;
  --suite-shadow: rgba(0, 0, 0, 0.4);
}

.suite-hub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--suite-card, #F7F5EE);
  border: 1.5px solid var(--suite-ink, #1B2A4A);
  border-radius: 10px;
  padding: 8px 14px;
  margin-bottom: 16px;
  box-shadow: 0 4px 12px var(--suite-shadow, rgba(27,42,74,0.08));
  flex-wrap: wrap;
  width: 100%;
  box-sizing: border-box;
}
.suite-brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Fjalla One', sans-serif;
  font-size: 14px;
  letter-spacing: 0.5px;
  color: var(--suite-ink, #1B2A4A);
}
.suite-nav-links {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  flex: 1;
}
.suite-link {
  text-decoration: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--suite-line, #cdc7b2);
  background: var(--suite-bg, #EDEAE1);
  color: var(--suite-ink, #1B2A4A);
  transition: all 0.2s ease;
  white-space: nowrap;
}
.suite-link:hover {
  background: var(--suite-card-hover, #fff);
  border-color: var(--suite-gold, #B98A2E);
}
.suite-link.active {
  background: var(--suite-ink, #1B2A4A) !important;
  color: #ffffff !important;
  border-color: var(--suite-ink, #1B2A4A) !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.suite-hub-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.suite-btn-theme {
  background: var(--suite-bg, #EDEAE1);
  color: var(--suite-ink, #1B2A4A);
  border: 1.5px solid var(--suite-ink, #1B2A4A);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.suite-btn-theme:active { transform: scale(0.92); }


  /* Global Modern UI Additions */
  body {
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .stage {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    border: 1px solid var(--line);
    padding: 24px;
    margin-top: 10px;
    transition: box-shadow 0.3s ease;
  }
  body.dark .stage {
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
  }
  button {
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, background-color 0.2s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  button:active:not(:disabled) {
    transform: translateY(0);
  }
  input[type="text"], input[type="password"], textarea, select {
    border-radius: 8px;
    border: 1px solid var(--line);
    padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--paper);
    color: var(--ink);
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }
  /* Modern Flashcards */
  .flashcard {
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      transition: transform 0.4s ease;
  }
  .flashcard:hover {
      transform: translateY(-5px);
  }

<body>
<div class="wrap">

  <h1>German Grammar &amp; Rules Trainer</h1>
  <div class="sub">21 Essential Grammar Pillars (A2–B2) for Fluent Speaking &amp; Exam Success</div>

  <!-- Mode Tabs -->
  <div class="ds-tabs" style="margin-bottom: var(--space-lg); display: flex; gap: 8px; flex-wrap: wrap;">
    <div class="ds-tab active" id="tabStudy" onclick="switchMode('study')" style="cursor:pointer; padding: 12px 24px; font-weight: 600; border-radius: var(--radius-md); transition: all 0.2s; background: var(--color-surface); border: 1px solid var(--color-border);">📘 Rule Guide &amp; Tables</div>
    <div class="ds-tab" id="tabDrill" onclick="switchMode('drill')" style="cursor:pointer; padding: 12px 24px; font-weight: 600; border-radius: var(--radius-md); transition: all 0.2s; background: var(--color-surface); border: 1px solid var(--color-border);">⚡ Interactive Practice Drill</div>
    <div class="ds-tab" id="tabStats" onclick="switchMode('stats')" style="cursor:pointer; padding: 12px 24px; font-weight: 600; border-radius: var(--radius-md); transition: all 0.2s; background: var(--color-surface); border: 1px solid var(--color-border);">📈 Mastery &amp; Progress</div>
  </div>
  
  <style>
    .ds-tab.active { background: var(--color-primary) !important; color: white !important; border-color: var(--color-primary) !important; }
    .ds-tab:not(.active):hover { border-color: var(--color-primary); color: var(--color-primary); }
  </style>

  <!-- Rule Filter Chips -->
  <div class="filterbox" style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-xl); box-shadow: var(--shadow-sm);">
    
    <div class="filterlabel" style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--color-ink-soft); font-weight: 600; margin-bottom: var(--space-md);">Select German Grammar Pillar:</div>
    <div style="margin-bottom:var(--space-md); display:flex; gap:8px;">
        <button onclick="toggleWeaknessVault()" id="btnWeakness" class="ds-btn ds-btn-primary" style="background: #ef4444; border-color: #ef4444; font-size:13px;">🔥 Drill Weaknesses (Box 1-2)</button> 
        <button onclick="showGrammarVault()" class="ds-btn ds-btn-secondary" style="font-size:13px;">📚 View My Grammar Weaknesses</button>
    </div>
    
    <div class="chiprow" id="ruleChips" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;"></div>

  </div>

  <!-- Dynamic Content Area -->
  <div id="contentArea"></div>

</div>

<script>
/* =========================================================================
   21 ESSENTIAL GERMAN GRAMMAR RULES (A2–B2) WITH EXPLANATIONS, TABLES & DRILLS
   ========================================================================= */
const GRAMMAR_RULES = [
  {
    id: "r1_wordorder",
    num: "1",
    title: "Verb Position & Satzklammer (Sentence Structure)",
    category: "Syntax",

async function callAIGrammarExplanation(promptText, callback) {
  const provider = localStorage.getItem('de_ai_provider') || 'groq';
  const apiKey = localStorage.getItem('de_ai_key_' + provider);
  
  let endpoint = 'https://api.groq.com/openai/v1/chat/completions';
  let model = 'llama3-8b-8192';

  if (provider === 'openai') {
    endpoint = 'https://api.openai.com/v1/chat/completions';
    model = 'gpt-4o-mini';
  } else if (provider === 'ollama') {
    endpoint = localStorage.getItem('de_ai_endpoint_ollama') || 'http://localhost:11434/v1/chat/completions';
    model = localStorage.getItem('de_ai_model_ollama') || 'llama3';
  }
  
  const headers = { "Content-Type": "application/json" };
  if (apiKey) {
    headers["Authorization"] = `Bearer ${apiKey}`;
  }

  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        model: model,
        messages: [{ role: "user", content: promptText }]
      })
    });
    const data = await res.json();
    if(data.choices && data.choices.length>0) {
      callback(data.choices[0].message.content);
    } else {
      callback("AI Error: " + JSON.stringify(data));
    }
  } catch(e) {
    callback("Error connecting to AI: " + e.message);
  }
}

function explainWrongAnswerAI(chosenOpt) {
  const fbBtn = document.getElementById("aiExplainBtn");
  if(fbBtn) fbBtn.innerText = "⏳ Loading...";
  
  const q = currentQuestion;
  const rule = (q && q.ruleId) ? GRAMMAR_RULES.find(r => r.id === q.ruleId) : null;
  const promptTxt = `I am learning German. I answered this grammar question incorrectly.
Sentence: "${q.prompt}"
Correct answer: "${q.options ? q.options[q.correct] : q.en}"
My incorrect answer: "${chosenOpt}"
Rule context: ${rule ? rule.summary : (q.explain || '')}

Briefly explain EXACTLY why my answer is wrong and why the correct answer is right. Keep it short and encouraging.`;

  callAIGrammarExplanation(promptTxt, (exp) => {
    const fbBox = document.getElementById("aiExplainBox");
    if(fbBox) {
      fbBox.innerHTML = `<strong>🤖 KI-Erklärung:</strong><br>${exp.replace(/\n/g, '<br>')}`;
      fbBox.style.display = "block";
    }
    if(fbBtn) fbBtn.style.display = "none";
    
    const vault = JSON.parse(localStorage.getItem('de_grammar_vault') || '[]');
    vault.push({
      date: new Date().toISOString(),
      prompt: q.prompt,
      correct: q.options ? q.options[q.correct] : q.en,
      wrong: chosenOpt,
      explanation: exp
    });
    localStorage.setItem('de_grammar_vault', JSON.stringify(vault));
  });
}

// AI weak-spot follow-up: the offline question bank is the default source for
// practice (works with no network/AI configured at all). This is an optional
// extra - when AI is configured, it asks the model for ONE brand-new question
// on the exact rule+difficulty the learner just got wrong, instead of just
// re-serving from the same fixed offline bank. If AI isn't configured, errors,
// or returns something unparseable, this always falls back to the normal
// offline generator rather than leaving the learner stuck.
function generateAIPracticeQuestion(){
  const cur = currentQuestion;
  const ruleId = cur && cur.ruleId;
  const rule = ruleId ? GRAMMAR_RULES.find(r => r.id === ruleId) : null;
  const btn = document.getElementById("aiGenerateBtn");

  if(!rule){
    drillAnswered = false;
    currentQuestion = generateInfiniteQuestion(selectedRuleId);
    currentQuestion.aiFallbackNotice = "Couldn't tell which rule to generate for — showing another offline question instead.";
    renderContent();
    return;
  }

  if(btn){ btn.disabled = true; btn.innerText = "⏳ Generating..."; }
  const diffLabel = (currentDifficulty === 'mixed') ? 'medium' : currentDifficulty;
  const promptTxt = `Create ONE new German grammar practice question (multiple choice gap-fill) for a learner studying this exact topic: "${rule.title}".
Topic summary: ${rule.summary}
Target difficulty: ${diffLabel}.

Respond with ONLY valid JSON, no markdown formatting, no text outside the JSON, in exactly this shape:
{"prompt":"German sentence with ___ marking the gap","en":"English translation of the completed sentence","options":["optionA","optionB","optionC","optionD"],"correct":0,"explain":"short English explanation of why the correct option is right"}
"correct" is the zero-based index into "options" of the single grammatically correct choice. Use real, natural German and make sure exactly one option is correct.`;

  callAIGrammarExplanation(promptTxt, (raw) => {
    if(btn){ btn.disabled = false; btn.innerText = "🤖 More Practice On This (AI)"; }
    try {
      const match = raw.match(/\{[\s\S]*\}/);
      const parsed = JSON.parse(match ? match[0] : raw);
      if(!parsed.prompt || !Array.isArray(parsed.options) || parsed.options.length < 2 || typeof parsed.correct !== 'number' || !parsed.options[parsed.correct]){
        throw new Error("Malformed AI response");
      }
      currentQuestion = {
        ruleNum: rule.num, ruleTitle: rule.title, prompt: parsed.prompt, en: parsed.en || "",
        options: parsed.options, correct: parsed.correct, explain: parsed.explain || "",
        type: 'choice', ruleId: rule.id, diff: currentDifficulty, aiGenerated: true
      };
      drillAnswered = false;
      renderContent();
    } catch(e) {
      drillAnswered = false;
      currentQuestion = generateInfiniteQuestion(rule.id);
      // The feedback box (and #aiGenStatus inside it) resets on a fresh
      // unanswered question, so a status message written there would never
      // be seen - attach the notice to the question itself instead, and
      // render it as a small banner (see renderDrillView).
      currentQuestion.aiFallbackNotice = "⚠️ AI question generation isn't available right now (check your AI key in Settings) — showing an offline practice question instead.";
      renderContent();
    }
  });
}

function generateInfiniteQuestion(ruleId) {
  let targetRule = ruleId;
  
  if (drillWeaknessesOnly) {
    const weakRules = Object.keys(DYNAMIC_GENERATORS).filter(key => {
      const p = PROGRESS[key] || { box: 1 };
      return p.box <= 2;
    });
    if (weakRules.length > 0) {
      targetRule = weakRules[Math.floor(Math.random() * weakRules.length)];
    }
  }

  if (targetRule === 'alle' || !DYNAMIC_GENERATORS[targetRule]) {
    const keys = Object.keys(DYNAMIC_GENERATORS);
    targetRule = keys[Math.floor(Math.random() * keys.length)];
  }

  // Determine question format:
  // A specific difficulty (easy/medium/hard) only filters tagged "choice" generators,
  // so force choice format whenever a difficulty filter is active - otherwise "build"
  // mode (untagged) would silently ignore the difficulty half the time.
  let chosenFormat = drillFormat;
  if (drillFormat === 'mixed') {
    chosenFormat = (currentDifficulty !== 'mixed') ? 'choice' : (Math.random() < 0.5 ? 'choice' : 'build');
  }

  if (chosenFormat === 'build' && BUILD_GENERATORS[targetRule]) {
    const list = BUILD_GENERATORS[targetRule];
    const gen = list[Math.floor(Math.random() * list.length)];
    const raw = gen();
    const tokenObjs = raw.tokens.map((w, idx) => ({ word: w, id: idx }));
    buildSlots = [];
    bankWords = [...tokenObjs].sort(() => Math.random() - 0.5);
    return {
      ...raw,
      type: 'build',
      ruleId: targetRule
    };
  } else {
    const generatorList = DYNAMIC_GENERATORS[targetRule];
    // Retry a few times to find a question matching the active difficulty filter
    // (only newer generators tag their questions with `diff`; legacy ones don't,
    // so after enough retries we just accept whatever was drawn rather than loop
    // forever or leave the drill screen empty).
    let raw = null;
    const maxAttempts = currentDifficulty === 'mixed' ? 1 : 15;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const generatorFn = generatorList[Math.floor(Math.random() * generatorList.length)];
      raw = generatorFn();
      if (currentDifficulty === 'mixed' || raw.diff === currentDifficulty) break;
    }
    const correctOpt = raw.options[raw.correct];
    const shuffled = [...raw.options].sort(()=>Math.random() - 0.5);
    return {
      ...raw,
      type: 'choice',
      ruleId: targetRule,
      options: shuffled,
      correct: shuffled.indexOf(correctOpt)
    };
  }
}

/* ---- Task 52: merge the additional rules (js/grammar-rules-extra.js), give every rule a CEFR level and
   number the list A1 → B2, so beginners start at the top ---- */
(function mergeExtraRules(){
  const LV = { r1_wordorder:'A1', r2_cases:'A2', r3_prepositions:'A2', r4_adjectives:'A2', r5_konjunktiv:'A2', r10_reflexiv:'A2',
    r6_passiv:'B1', r7_relativsatz:'B1', r8_infinitiv:'B1', r9_connectors:'B1', r11_paragraph:'B1', r12_comma:'B1', r13_ndeklination:'B1',
    r14_pronominaladverb:'B1', r15_temporale:'B1', r16_modalverb:'B1', r17_indirekte_rede:'B2', r18_partizipialattribute:'B2',
    r19_doppelkonjunktionen:'B2', r20_nominalisierung:'B2', r21_genitivpraepositionen:'B2' };
  GRAMMAR_RULES.forEach(r => { r.level = r.level || LV[r.id] || 'B1'; r.title = r.title.replace(/\s*—\s*B2$/, ''); });
  (window.DC_GRAMMAR_EXTRA || []).forEach(x => {
    if (GRAMMAR_RULES.some(r => r.id === x.id)) return;
    const qs = x.bank.map(b => ({ prompt: b.p, en: b.en, options: b.o.slice(), correct: 0, explain: b.exp }));
    GRAMMAR_RULES.push(Object.assign({ drills: qs.slice(0, 4) }, x));
    DYNAMIC_GENERATORS[x.id] = [() => { const q = qs[Math.floor(Math.random() * qs.length)];
      return { ruleNum: x.num, ruleTitle: x.title.split('(')[0].trim(), prompt: q.prompt, en: q.en, options: q.options.slice(), correct: 0, explain: q.explain }; }];
  });
  const ORDER = ['A1', 'A2', 'B1', 'B2'];
  GRAMMAR_RULES.sort((a, b) => ORDER.indexOf(a.level) - ORDER.indexOf(b.level));   // stable: keeps the old order inside a level
  GRAMMAR_RULES.forEach((r, i) => { r.num = String(i + 1); });
  Object.keys(DYNAMIC_GENERATORS).forEach(id => {                 // drills show the rule's new number
    const rule = GRAMMAR_RULES.find(r => r.id === id); if (!rule) return;
    DYNAMIC_GENERATORS[id] = DYNAMIC_GENERATORS[id].map(g => () => Object.assign(g(), { ruleNum: rule.num }));
  });
})();

function init(){
  renderRuleChips();
  renderContent();
}

function renderRuleChips(){
  const container = document.getElementById("ruleChips");
  const allList = [
    { id: "alle", num: "🎲", title: "All Rules Mixed (Endless Marathon)", category: "Mixed", color: "var(--purple)" },
    ...GRAMMAR_RULES
  ];
  let lastLv = '';
  container.innerHTML = allList.map(r=>{
    const active = r.id === selectedRuleId ? "active" : "";
    const head = r.level && r.level !== lastLv ? `<div style="grid-column:1/-1; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; margin-top:6px;">${(lastLv = r.level)} · ${({A1:'Grundlagen', A2:'Aufbau', B1:'Mittelstufe', B2:'Fortgeschritten'})[r.level] || ''}</div>` : '';
    return head + `
      <div class="chip ${active}" onclick="selectRule('${r.id}')">
        <span class="dot" style="background:${r.color};"></span>
        <span>${r.id==='alle' ? '🎲 All Rules Mixed' : `Rule ${r.num}: ${r.title.split('(')[0].trim()}`}</span>
      </div>
    `;
  }).join("");
}

function selectRule(ruleId){
  selectedRuleId = ruleId;
  renderRuleChips();
  if(ruleId === 'alle'){
    switchMode('drill');
  } else if(currentMode === 'drill'){
    startDrillForRule(ruleId);
  } else {
    renderContent();
  }
}

function switchMode(mode){
  currentMode = mode;
  const tStudy = document.getElementById("tabStudy");
  const tDrill = document.getElementById("tabDrill");
  const tStats = document.getElementById("tabStats");
  
  if (mode === 'study') tStudy.classList.add('active'); else tStudy.classList.remove('active');
  if (mode === 'drill') tDrill.classList.add('active'); else tDrill.classList.remove('active');
  if (mode === 'stats') tStats.classList.add('active'); else tStats.classList.remove('active');
  
  if(mode === 'drill'){
    startDrillForRule(selectedRuleId);
  } else {
    renderContent();
  }
}

function renderContent(){
  const area = document.getElementById("contentArea");
  if(currentMode === 'study'){
    renderStudyView(area);
  } else if(currentMode === 'drill'){
    renderDrillView(area);
  } else if(currentMode === 'stats'){
    renderStatsView(area);
  }
}

function tamilBridgeHTML(ruleId){
  const items = (window.DC_GRAMMAR_TAMIL || {})[ruleId];

  const esc = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const head = `<div class="filterlabel" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">

  return head + items.map(it => `
    <div class="ta-bridge ${it.k === 'trap' ? 'trap' : ''}">
      <div class="tb-h">${it.k === 'trap' ? '⚠️ Tamil-Falle' : '✅ Leicht durch Tamil'} · ${esc(it.t)}</div>
      ${it.table ? `<table class="de-table"><tr><th>Deutsch</th><th>தமிழ்</th><th>English</th></tr>${it.table.map(r => `<tr><td><b>${esc(r[0])}</b></td><td lang="ta">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table>` : ''}
      <div class="tb-row"><span class="lb">Deutsch</span><span>${esc(it.de)} <button class="speak-btn" style="padding:1px 6px;" onclick="speakText('${escapeQuotes(it.de.split(' · ')[0])}')">🔊</button></span>
        <span class="lb">தமிழ்</span><span class="tb-ta" lang="ta">${esc(it.ta)}</span>
        <span class="lb">word by word</span><span class="tb-gl">${esc(it.gloss)}</span></div>
      <div class="tb-why">${esc(it.why)}</div>
      <div class="tb-whyta" lang="ta">🇮🇳 ${esc(it.why_ta)}</div>
    </div>`).join('') + `<div class="note" style="font-size:11px; opacity:.75; margin:-4px 0 12px;">🤖 Tamil-Vergleiche KI-unterstützt erstellt und geprüft — Fehler bitte melden.</div>`;
}

/* ---------------- SENTENCE BUILDER INTERACTION HANDLERS ---------------- */
function renderBuildSlots(){
  const build = document.getElementById('buildArea');
  const bank = document.getElementById('bankArea');
  if(!build || !bank) return;

  build.innerHTML = buildSlots.length
    ? buildSlots.map((w, idx) => `
        <span class="wordchip inbuild" onclick="removeBuildToken(${idx})" title="Click to return to bank">
          ${w.word} <span style="font-size:10px; opacity:0.7; margin-left:3px;">✕</span>
        </span>
      `).join('')
    : `<span class="placeholder">👇 Click the words below in the correct order to form the German sentence ...</span>`;

  bank.innerHTML = bankWords.map((w, idx) => `
    <span class="wordchip inbank" onclick="addBankToken(${idx})" title="Click to add to sentence">
      ${w.word}
    </span>
  `).join('');
}

function addBankToken(bankIdx){
  if(drillAnswered) return;
  const item = bankWords[bankIdx];
  bankWords.splice(bankIdx, 1);
  buildSlots.push(item);
  renderBuildSlots();
}

function removeBuildToken(buildIdx){
  if(drillAnswered) return;
  const item = buildSlots[buildIdx];
  buildSlots.splice(buildIdx, 1);
  bankWords.push(item);
  renderBuildSlots();
}

function resetBuildSlots(){
  if(drillAnswered) return;
  bankWords = [...buildSlots, ...bankWords].sort(() => Math.random() - 0.5);
  buildSlots = [];
  renderBuildSlots();
}

function checkBuildAnswer(){
  if(drillAnswered) return;
  if(buildSlots.length === 0){
    alert("Please click words from the bank below to build your German sentence!");
    return;
  }
  drillAnswered = true;
  const cur = currentQuestion;
  const userSentence = buildSlots.map(w => w.word).join(' ').trim();
  const correctSentence = cur.correctSentence || cur.tokens.join(' ');

  const isCorrect = userSentence === correctSentence || 
                    (cur.alternates && cur.alternates.includes(userSentence));

  const fb = document.getElementById("feedbackBox");
  const fbTitle = document.getElementById("feedbackTitle");
  const fbText = document.getElementById("feedbackText");
  const actionRow = document.getElementById("buildActionRow");
  if(actionRow) actionRow.style.display = "none";

  fb.style.display = "block";
  drillStats.total++;
  if(isCorrect){
    drillStats.correct++;
    currentStreak++;
    saveStreaks();
    if(currentStreak > bestStreak) bestStreak = currentStreak;
    saveStreaks();
    fb.className = "feedback-box correct";
    fbTitle.textContent = "✅ Richtig! Ausgezeichnete Satzstellung!";
    recordRuleResult(cur.ruleId || selectedRuleId, true);
  } else {
    drillStats.wrong++;
    currentStreak = 0;
    saveStreaks();
    fb.className = "feedback-box wrong";
    fbTitle.textContent = "❌ Noch nicht ganz!";
    recordRuleResult(cur.ruleId || selectedRuleId, false);
    if (window.DCMistakes) DCMistakes.add({ src: 'grammar', href: 'Grammatik_Regel_Trainer.html', q: cur.en || cur.prompt, hint: 'Bau den Satz auf Deutsch.',
      answer: correctSentence, alts: cur.alternates || [], given: userSentence, why: cur.explain || '' });   // Meine_Fehler.html
  }

  fbText.innerHTML = `
    <div style="margin-bottom:8px;">
      <b>Target German Sentence:</b><br>
      <span style="font-size:15px; color:var(--green); font-weight:700;">„${escapeQuotes(correctSentence)}”</span>
    </div>
    <div style="font-size:13px; line-height:1.5; margin-bottom:10px; background:#fff; padding:8px 10px; border-radius:6px; border:1px solid var(--line);">
      💡 <b>Grammar Explanation:</b> ${cur.explain}
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="speak-btn" style="width:auto; border-radius:18px; padding:6px 12px; gap:6px;" onclick="speakText('${escapeQuotes(correctSentence)}')">
        🔊 Listen in German
      </button>
      ${!isCorrect ? `<button class="actbtn" style="background:#fff; color:var(--ink); padding:6px 12px; font-size:11px;" onclick="retryCurrentQuestion()">↺ Retry This Question</button>` : ''}
      ${!isCorrect ? `<button id="aiExplainBtn" class="actbtn" style="background:var(--ink); color:#fff; padding:6px 12px; font-size:11px;" onclick="explainWrongAnswerAI('${buildOrder.map(w=>w.text).join(' ')}')">🤖 KI-Erklärung (Why is this wrong?)</button>` : ''}
    </div>
    <div id="aiExplainBox" style="display:none; margin-top:8px; padding:8px; background:#fff; border:1px solid var(--line); border-radius:4px; font-size:12px;"></div>
  `;

  document.getElementById("nextDrillBtn").style.display = "block";
  document.getElementById("finishDrillBtn").style.display = "block";
}

function checkAnswer(chosenIdx){
  if(drillAnswered) return;
  drillAnswered = true;
  const cur = currentQuestion;
  const isCorrect = chosenIdx === cur.correct;
  const fb = document.getElementById("feedbackBox");
  const fbTitle = document.getElementById("feedbackTitle");
  const fbText = document.getElementById("feedbackText");

  cur.options.forEach((_,i)=>{
    const btn = document.getElementById(`optBtn_${i}`);
    if(btn){
      btn.disabled = true;
      if(i === cur.correct) btn.classList.add("correct");
      else if(i === chosenIdx) btn.classList.add("wrong");
    }
  });

  fb.style.display = "block";
  drillStats.total++;
  if(isCorrect){
    drillStats.correct++;
    currentStreak++;
    saveStreaks();
    if(currentStreak > bestStreak) bestStreak = currentStreak;
    saveStreaks();
    fb.className = "feedback-box correct";
    fbTitle.textContent = "✅ Richtig! Ausgezeichnet!";
    recordRuleResult(cur.ruleId || selectedRuleId, true);
  } else {
    drillStats.wrong++;
    currentStreak = 0;
    saveStreaks();
    fb.className = "feedback-box wrong";
    fbTitle.textContent = "❌ Nicht ganz!";
    recordRuleResult(cur.ruleId || selectedRuleId, false);
    if (window.DCMistakes) DCMistakes.add({ src: 'grammar', href: 'Grammatik_Regel_Trainer.html', kind: 'choice', q: cur.prompt, hint: cur.en || '',
      options: cur.options, answer: cur.options[cur.correct], given: cur.options[chosenIdx], why: cur.explain || '' });   // Meine_Fehler.html
  }
  fbText.innerHTML = `
    <div style="background:#fff; padding:8px 10px; border-radius:6px; border:1px solid var(--line); margin-bottom:8px;">
      💡 <b>Why this is the rule:</b> ${cur.explain}
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="speak-btn" onclick="speakText('${escapeQuotes(cur.prompt.replace('___', cur.options[cur.correct]))}')">🔊 Listen to full sentence</button>
      ${!isCorrect ? `<button class="actbtn" style="background:#fff; color:var(--ink); padding:6px 12px; font-size:11px;" onclick="retryCurrentQuestion()">↺ Retry This Question</button>` : ''}
      ${!isCorrect ? `<button id="aiExplainBtn" class="actbtn" style="background:var(--ink); color:#fff; padding:6px 12px; font-size:11px;" onclick="explainWrongAnswerAI('${escapeQuotes(cur.options[chosenIdx])}')">🤖 KI-Erklärung (Why is this wrong?)</button>` : ''}
      ${!isCorrect ? `<button id="aiGenerateBtn" class="actbtn" style="background:var(--purple, #6B4A8A); color:#fff; padding:6px 12px; font-size:11px;" onclick="generateAIPracticeQuestion()">🤖 More Practice On This (AI)</button>` : ''}
    </div>
    <div id="aiExplainBox" style="display:none; margin-top:8px; padding:8px; background:#fff; border:1px solid var(--line); border-radius:4px; font-size:12px;"></div>
    <div id="aiGenStatus" style="display:none; margin-top:8px; padding:8px; background:#fff; border:1px solid var(--line); border-radius:4px; font-size:11.5px; color:var(--ink-soft);"></div>
  `;

  document.getElementById("nextDrillBtn").style.display = "block";
  document.getElementById("finishDrillBtn").style.display = "block";
}

function retryCurrentQuestion(){
  drillAnswered = false;
  buildOrder = [];
  renderContent();
}

function advanceDrill(){
  if(!endlessMode && drillStats.total >= 10){
    showSessionSummary();
    return;
  }
  drillAnswered = false;
  currentQuestion = generateInfiniteQuestion(selectedRuleId);
  renderContent();
}

function showSessionSummary(){
  const area = document.getElementById("contentArea");
  const pct = drillStats.total > 0 ? Math.round((drillStats.correct / drillStats.total) * 100) : 0;
  area.innerHTML = `
    <div class="drill-card" style="text-align:center;">
      <h2 style="font-family:'Fjalla One',sans-serif; font-size:26px; margin:0 0 8px;">🎉 Training Session Summary</h2>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:16px; margin-bottom:12px;">
        Questions Completed: <b>${drillStats.total}</b> · Score: <b style="color:var(--green); font-size:24px;">${drillStats.correct}</b> / ${drillStats.total} (${pct}%)
      </div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:14px; margin-bottom:18px; color:var(--red);">
        Best Streak: <b>${bestStreak} 🔥</b>
      </div>
      <p style="font-size:13px; color:var(--ink-soft); margin-bottom:20px;">
        ${pct >= 80 ? "Hervorragend! Your German grammar intuition is sharpening rapidly!" : "Gute Übung! Keep training endlessly to cement the automatic word order and endings."}
      </p>
      <div style="display:flex; gap:8px;">
        <button class="bigbtn" style="flex:1;" onclick="startDrillForRule(selectedRuleId)">♾️ Continue Endless Training</button>
        <button class="bigbtn secondary" style="flex:1;" onclick="switchMode('stats')">📊 View Mastery Matrix</button>
      </div>
    </div>
  `;
}

function nextRuleDrill(){
  const curIdx = GRAMMAR_RULES.findIndex(r=>r.id === selectedRuleId);
  const nextIdx = (curIdx + 1) % GRAMMAR_RULES.length;
  selectRule(GRAMMAR_RULES[nextIdx].id);
  switchMode('drill');
}

function recordRuleResult(ruleId, correct){
  if(ruleId === 'alle') return;
  if(!PROGRESS[ruleId]) PROGRESS[ruleId] = { correct:0, wrong:0, box:1 };
  if(correct){
    PROGRESS[ruleId].correct++;
    PROGRESS[ruleId].box = Math.min(5, (PROGRESS[ruleId].box || 1) + 1);
  } else {
    PROGRESS[ruleId].wrong++;
    PROGRESS[ruleId].box = 1;
  }
  saveProgress();
}

// Keyboard shortcuts for fast training (1, 2, 3, 4 for gap-fill; Enter to check/advance)
document.addEventListener("keydown", (e)=>{
  if(currentMode !== 'drill') return;
  if(['1','2','3','4'].includes(e.key)){
    const idx = parseInt(e.key) - 1;
    const btn = document.getElementById(`optBtn_${idx}`);
    if(btn && !btn.disabled) checkAnswer(idx);
  } else if(e.key === 'Enter'){
    const nextBtn = document.getElementById("nextDrillBtn");
    if(nextBtn && nextBtn.style.display !== 'none'){
      advanceDrill();
    } else if(currentQuestion && currentQuestion.type === 'build' && !drillAnswered){
      checkBuildAnswer();
    }
  }
});

/* ---------------- 3. STATS VIEW ---------------- */
function renderStatsView(container){
  let totalMastered = 0;
  let totalPracticed = 0;
  GRAMMAR_RULES.forEach(r=>{
    const p = PROGRESS[r.id];
    if(p && (p.box||1) >= 4) totalMastered++;
    if(p && (p.correct + p.wrong > 0)) totalPracticed++;
  });

  container.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num">${GRAMMAR_RULES.length}</div>
        <div class="stat-lbl">CORE RULES</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalPracticed}</div>
        <div class="stat-lbl">RULES PRACTICED</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalMastered}</div>
        <div class="stat-lbl">RULES MASTERED</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${Math.round((totalMastered/GRAMMAR_RULES.length)*100)}%</div>
        <div class="stat-lbl">EXAM READINESS</div>
      </div>
    </div>

    <div class="rule-card">
      <h2 style="font-family:'Fjalla One',sans-serif; font-size:18px; margin:0 0 12px;">Pillar Mastery Breakdown</h2>
      <table class="de-table">
        <tr><th>Rule Pillar</th><th>Box (1–5)</th><th>Accuracy</th><th>Action</th></tr>
        ${GRAMMAR_RULES.map(r=>{
          const p = PROGRESS[r.id] || { correct:0, wrong:0, box:1 };
          const tot = p.correct + p.wrong;
          const acc = tot ? Math.round((p.correct/tot)*100) + "%" : "Not yet";
          return `
            <tr>
              <td><b>Rule ${r.num}:</b> ${r.title.split('(')[0]}</td>
              <td><span style="font-weight:700; color:${p.box>=4?'var(--green)':p.box>=2?'var(--gold)':'var(--red)'};">Box ${p.box || 1}</span></td>
              <td>${acc} (${p.correct}/${tot})</td>
              <td><button class="hub-link" onclick="selectRule('${r.id}'); switchMode('drill');">⚡ Practice</button></td>
            </tr>
          `;
        }).join("")}
      </table>
      <button class="bigbtn secondary" style="margin-top:16px;" onclick="resetProgress()">Reset Grammar Progress</button>
    </div>
  `;
}

function resetProgress(){
  if(confirm("Reset all grammar progress?")){
    PROGRESS = {};
    saveProgress();
    renderContent();
  }
}

/* ---------------- AUDIO SPEECH SYNTHESIS ---------------- */
function speakText(txt){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "de-DE";
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function escapeQuotes(str){
  return (str||'').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// Initial boot
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// UNIFIED SUITE THEME SYSTEM
function initSuiteTheme() {
  const saved = localStorage.getItem('de_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved === 'dark' || (!saved && prefersDark);
  applyTheme(isDark);
}
function applyTheme(isDark) {
  if (isDark) {
    document.documentElement.classList.add('dark-theme');
    document.body.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark-theme');
    document.body.classList.remove('dark');
  }
  const btn = document.getElementById('themeToggleBtn') || document.getElementById('themeToggle');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}
function toggleSuiteTheme() {
  const isDarkNow = document.documentElement.classList.contains('dark-theme') || document.body.classList.contains('dark');
  const nextDark = !isDarkNow;
  localStorage.setItem('de_theme', nextDark ? 'dark' : 'light');
  applyTheme(nextDark);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSuiteTheme);
} else {
  initSuiteTheme();
}

function getGenderClass(article) {
  if (article === "der") return "gender-der";

  if (article === "das") return "gender-das";
  return "";
}

<div id="grammarVaultModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;">
  <div style="background:var(--paper); width:100%; max-width:600px; max-height:80vh; overflow-y:auto; border-radius:8px; padding:20px; position:relative;">
    <button onclick="document.getElementById('grammarVaultModal').style.display='none'" style="position:absolute; top:10px; right:10px; background:var(--red); color:#fff; border:none; border-radius:4px; padding:5px 10px; cursor:pointer;" class="ds-btn ds-btn-secondary">Close</button>
    <h2 style="margin-top:0; font-family:'Fjalla One',sans-serif; color:var(--ink);">📖 My Grammar Weaknesses</h2>
    <div id="grammarVaultContent"></div>
  </div>
</div>

<script>

function showGrammarVault() {
  let vault = [];
  try {
    vault = JSON.parse(localStorage.getItem('de_grammar_vault') || '[]');
    if (!Array.isArray(vault)) vault = [];
  } catch(e) {
    console.error("Corrupted vault JSON", e);
  }
  
  const content = document.getElementById('grammarVaultContent');
  if (vault.length === 0) {
    content.innerHTML = '<p>No weaknesses recorded yet. Keep practicing!</p>';
  } else {
    content.innerHTML = [...vault].reverse().map(v => {
      const dateStr = v.date ? new Date(v.date).toLocaleString() : 'Unknown Date';
      const promptStr = escapeQuotes(v.prompt || '');
      const wrongStr = escapeQuotes(v.wrong || '');
      const correctStr = escapeQuotes(v.correct || '');
      const expStr = (v.explanation || '').replace(/\n/g, '<br>');
      
      return `
      <div style="background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:12px;">
        <div style="font-size:12px; color:var(--ink-soft); margin-bottom:4px;">${dateStr}</div>
        <div style="font-weight:bold; margin-bottom:4px;">Prompt: ${promptStr}</div>
        <div style="color:var(--red); margin-bottom:2px;">Your Answer: ${wrongStr}</div>
        <div style="color:var(--green); margin-bottom:8px;">Correct: ${correctStr}</div>
        <div style="background:#fff; padding:8px; border-left:3px solid var(--gold); font-size:13px; line-height:1.4;">
          ${expStr}
        </div>
      </div>
      `;
    }).join('');
  }
  document.getElementById('grammarVaultModal').style.display = 'flex';
}

</script>
