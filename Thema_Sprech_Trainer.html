<style>
  :root{
    --paper:#EDEAE1; --paper-dark:#E1DDCF; --card:#F7F5EE; --ink:#1B2A4A; --ink-soft:#4A5878;
    --red:#AE3327; --red-dark:#8A281F; --gold:#B98A2E; --green:#3F6B4A; --blue:#2F5C8A;
    --purple:#6B4A8A; --line:#cdc7b2; --shadow:rgba(27,42,74,0.18);
  }
  html.dark-theme, body[data-theme="dark"] {
    --paper:#0f172a; --paper-dark:#1e293b; --card:#1e293b; --ink:#f8fafc; --ink-soft:#94a3b8;
    --red:#f87171; --red-dark:#ef4444; --gold:#fbbf24; --green:#4ade80; --blue:#38bdf8;
    --purple:#c084fc; --line:#334155; --shadow:rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  .wrap{width:100%; max-width:900px;}
  h1{font-family:'Fjalla One',sans-serif; font-size:24px; border-bottom:3px solid var(--ink); padding-bottom:6px; margin:0 0 4px;}
  .sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:16px;}

  .thema-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:10px; margin-bottom:18px;}
  .thema-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:14px;
    cursor:pointer; transition:all .15s; text-align:center;
  }
  .thema-card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 6px 14px var(--shadow);}
  .thema-card.active{border-color:var(--ink); background:var(--ink); color:#fff;}
  .thema-icon{width:36px; height:36px; margin:0 auto 8px; color:var(--gold);}
  .thema-card.active .thema-icon{color:#fff;}
  .thema-title{font-family:'Fjalla One',sans-serif; font-size:15px;}
  .thema-progress{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:4px;}
  .thema-card.active .thema-progress{color:#e5e0d0;}

  .backbtn{
    background:none; border:none; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;
    font-size:12px; cursor:pointer; padding:6px 0; margin-bottom:10px; font-weight:600;
  }
  .backbtn:hover{color:var(--ink);}

  .verb-list{display:flex; flex-direction:column; gap:10px;}
  .verb-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .verb-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer;
    gap:10px;
  }
  .verb-head:hover{background:var(--paper-dark);}
  .verb-icon{width:26px; height:26px; color:var(--blue); flex-shrink:0;}
  .verb-titlewrap{flex:1;}
  .verb-inf{font-family:'Fjalla One',sans-serif; font-size:17px; color:var(--ink);}
  .verb-en{font-size:11.5px; color:var(--ink-soft); font-style:italic;}
  .verb-badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; padding:3px 8px;
    border-radius:10px; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
    white-space:nowrap;
  }
  .verb-badge.done{background:var(--green); color:#fff; border-color:var(--green);}
  .chevron{transition:transform .2s; color:var(--ink-soft); flex-shrink:0;}
  .verb-card.open .chevron{transform:rotate(180deg);}

  .verb-body{display:none; padding:0 16px 16px;}
  .verb-card.open .verb-body{display:block;}

  .allplay-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .allplay-btn{
    font-family:'Fjalla One',sans-serif; font-size:13px; padding:8px 14px; border-radius:6px;
    border:1.5px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;
  }
  .allplay-btn.stop{background:var(--red); border-color:var(--red-dark);}
  .markdone-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:8px 12px; border-radius:6px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; font-weight:600;
  }
  .markdone-btn.done{background:var(--green); color:#fff; border-color:var(--green);}

  .sent-row{
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;
  }
  .sent-row.active-playing{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset;}
  .sent-person{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; color:var(--purple);
    text-transform:uppercase; margin-bottom:3px;
  }
  .sent-de{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.4;}
  .sent-de b{color:var(--red);}
  .sent-en{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:2px;}
  .sent-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .icon-btn{
    background:none; border:1.5px solid var(--line); border-radius:50%; width:30px; height:30px;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px;
    flex-shrink:0; transition:all .15s;
  }
  .icon-btn:hover{background:var(--paper); border-color:var(--ink);}
  .icon-btn.loop-on{background:var(--gold); border-color:var(--gold); color:#fff;}
  .icon-btn.rec-on{background:var(--red); border-color:var(--red); color:#fff; animation:pulse 1.5s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.55;}100%{opacity:1;}}

  .transcript-box{
    display:none; margin-top:8px; padding:8px 10px; background:var(--paper); border-radius:6px;
    font-size:12.5px; line-height:1.5;
  }
  .transcript-box.visible{display:block;}
  .transcript-label{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase;
    color:var(--ink-soft); font-weight:700; display:block; margin-bottom:3px;
  }
  .diffchar{background:#fff3a0; padding:0 2px; border-radius:3px; font-weight:700; color:var(--red-dark);}

  .rate-row{display:flex; gap:6px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .rate-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 10px; border-radius:16px;
    border:1.5px solid var(--line); background:var(--card); cursor:pointer; color:var(--ink-soft); font-weight:600;
  }
  .rate-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .empty-state{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}
</style>

/* =========================================================================
   PROGRESS (simple per-verb "practiced" tracker - honest about what this
   is: a completion flag, not a full SRSEngine spaced-repetition item, since
   each entry here is a set of 6 sentences, not a single flashcard).
   ========================================================================= */
const PROG_KEY = 'thema_sprech_progress_v1';
let PROGRESS = JSON.parse(localStorage.getItem(PROG_KEY) || '{}');
function saveProgress(){ localStorage.setItem(PROG_KEY, JSON.stringify(PROGRESS)); }
function verbKey(themaId, inf){ return themaId + '|' + inf; }
function isVerbDone(themaId, inf){ return !!PROGRESS[verbKey(themaId, inf)]; }
function toggleVerbDone(themaId, inf){
  const k = verbKey(themaId, inf);
  PROGRESS[k] = !PROGRESS[k];
  saveProgress();
}
function themaDoneCount(thema){
  return thema.verbs.filter(v => isVerbDone(thema.id, v.inf)).length;
}

/* =========================================================================
   STATE & NAVIGATION
   ========================================================================= */
let curThemaId = null;
let openVerbInf = null;

function init(){
  renderThemaGrid();
}

function renderThemaGrid(){
  const view = document.getElementById('mainView');
  view.innerHTML = `
    <div class="thema-grid">
      ${THEMEN.map(t => `
        <div class="thema-card" onclick="openThema('${t.id}')">
          <div class="thema-icon">${ICON_SVGS[t.icon] || ICON_SVGS['abstract']}</div>
          <div class="thema-title">${t.title}</div>
          <div class="thema-progress">${themaDoneCount(t)} / ${t.verbs.length} geübt</div>
        </div>
      `).join('')}
    </div>
  `;
}

function openThema(themaId){
  curThemaId = themaId;
  openVerbInf = null;
  renderVerbList();
}

function backToThemen(){
  curThemaId = null;
  stopAllAudio();
  renderThemaGrid();
}

function renderVerbList(){
  const thema = THEMEN.find(t => t.id === curThemaId);
  const view = document.getElementById('mainView');
  if(!thema){ renderThemaGrid(); return; }

  view.innerHTML = `
    <button class="backbtn" onclick="backToThemen()">← Zurück zu den Themen</button>
    <h2 style="font-family:'Fjalla One',sans-serif; font-size:20px; margin:0 0 4px;">${thema.title}</h2>
    <div class="sub" style="margin-bottom:14px;">Klicke ein Verb, um alle 6 Personen im Perfekt zu hören und zu üben.</div>
    <div class="verb-list" id="verbList">
      ${thema.verbs.map(v => renderVerbCardHTML(thema, v)).join('')}
    </div>
  `;
}

function renderVerbCardHTML(thema, v){
  const isOpen = (openVerbInf === v.inf);
  const done = isVerbDone(thema.id, v.inf);
  return `
    <div class="verb-card ${isOpen ? 'open' : ''}" id="verbcard_${cssId(v.inf)}">
      <div class="verb-head" onclick="toggleVerb('${thema.id}','${escapeQ(v.inf)}')">
        <div class="verb-icon">${ICON_SVGS[v.icon] || ICON_SVGS['abstract']}</div>
        <div class="verb-titlewrap">
          <div class="verb-inf">${v.inf}</div>
          <div class="verb-en">${v.en}</div>
        </div>
        <span class="verb-badge ${done ? 'done' : ''}">${done ? '✓ Geübt' : '6 Sätze'}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="verb-body">
        ${isOpen ? renderVerbBodyHTML(thema, v) : ''}
      </div>
    </div>
  `;
}

function renderVerbBodyHTML(thema, v){
  return `
    <div class="allplay-row">
      <button class="allplay-btn" id="allplayBtn_${cssId(v.inf)}" onclick="toggleAllPlay('${thema.id}','${escapeQ(v.inf)}')">▶️ Alle 6 nacheinander abspielen</button>
      <button class="markdone-btn ${isVerbDone(thema.id, v.inf) ? 'done' : ''}" id="markdoneBtn_${cssId(v.inf)}" onclick="toggleDoneBtn('${thema.id}','${escapeQ(v.inf)}')">${isVerbDone(thema.id, v.inf) ? '✓ Als geübt markiert' : 'Als geübt markieren'}</button>
    </div>
    <div id="sentList_${cssId(v.inf)}">
      ${v.sentences.map((s,i) => renderSentenceRowHTML(v.inf, i, s)).join('')}
    </div>
  `;
}

function renderSentenceRowHTML(inf, idx, s){
  const rowId = sentRowId(inf, idx);
  return `
    <div class="sent-row" id="${rowId}">
      <div class="sent-person">${s.p}</div>
      <div class="sent-de">${s.de}</div>
      <div class="sent-en">${s.en}</div>
      <div class="sent-actions">
        <button class="icon-btn" title="Anhören" onclick="playSentence('${escapeQ(inf)}', ${idx})">🔊</button>
        <button class="icon-btn" id="loopBtn_${cssId(inf)}_${idx}" title="Wiederholen (Loop)" onclick="toggleLoopSentence('${escapeQ(inf)}', ${idx})">🔁</button>
        <button class="icon-btn" id="recBtn_${cssId(inf)}_${idx}" title="Nachsprechen & vergleichen" onclick="toggleRecordSentence('${escapeQ(inf)}', ${idx})">🎙️</button>
      </div>
      <div class="transcript-box" id="transcript_${cssId(inf)}_${idx}"></div>
    </div>
  `;
}

function cssId(s){ return s.replace(/[^a-zA-Z0-9]/g,'_'); }
function escapeQ(s){ return String(s||'').replace(/'/g, "\\'"); }
function sentRowId(inf, idx){ return `sentrow_${cssId(inf)}_${idx}`; }
function stripHTML(s){ return String(s||'').replace(/<[^>]+>/g,''); }

function toggleVerb(themaId, inf){
  openVerbInf = (openVerbInf === inf) ? null : inf;
  stopAllAudio();
  renderVerbList();
}

function toggleDoneBtn(themaId, inf){
  toggleVerbDone(themaId, inf);
  renderVerbList();
}

/* =========================================================================
   AUDIO: play / loop / play-all, and record-and-compare
   ========================================================================= */
let loopingSentenceKey = null; // "inf|idx" of the sentence currently looping
let loopTimeout = null;
let allPlayState = null; // { inf, idx, timeout } while "play all" is running

function findSentence(inf, idx){
  const thema = THEMEN.find(t => t.id === curThemaId);
  if(!thema) return null;
  const v = thema.verbs.find(x => x.inf === inf);
  if(!v) return null;
  return v.sentences[idx];
}

function speakDE(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
  return u;
}

function stopAllAudio(){
  window.speechSynthesis.cancel();
  clearTimeout(loopTimeout);
  loopingSentenceKey = null;
  if(allPlayState){ clearTimeout(allPlayState.timeout); allPlayState = null; }
  document.querySelectorAll('.sent-row.active-playing').forEach(el => el.classList.remove('active-playing'));
  document.querySelectorAll('.icon-btn.loop-on').forEach(el => el.classList.remove('loop-on'));
  document.querySelectorAll('.allplay-btn.stop').forEach(el => { el.classList.remove('stop'); el.textContent = '▶️ Alle 6 nacheinander abspielen'; });
}

function playSentence(inf, idx){
  const s = findSentence(inf, idx);
  if(!s) return;
  window.speechSynthesis.cancel();
  clearTimeout(loopTimeout);
  document.querySelectorAll('.sent-row.active-playing').forEach(el => el.classList.remove('active-playing'));
  const row = document.getElementById(sentRowId(inf, idx));
  if(row) row.classList.add('active-playing');
  speakDE(stripHTML(s.de));
}

function toggleLoopSentence(inf, idx){
  const key = inf + '|' + idx;
  const btn = document.getElementById(`loopBtn_${cssId(inf)}_${idx}`);
  if(loopingSentenceKey === key){
    // stop looping this one
    loopingSentenceKey = null;
    clearTimeout(loopTimeout);
    window.speechSynthesis.cancel();
    if(btn) btn.classList.remove('loop-on');
    const row = document.getElementById(sentRowId(inf, idx));
    if(row) row.classList.remove('active-playing');
    return;
  }
  // stop any other loop/playback first
  document.querySelectorAll('.icon-btn.loop-on').forEach(el => el.classList.remove('loop-on'));
  window.speechSynthesis.cancel();
  clearTimeout(loopTimeout);
  loopingSentenceKey = key;
  if(btn) btn.classList.add('loop-on');
  runLoopStep(inf, idx, key);
}

function runLoopStep(inf, idx, key){
  if(loopingSentenceKey !== key) return;
  const s = findSentence(inf, idx);
  if(!s) return;
  document.querySelectorAll('.sent-row.active-playing').forEach(el => el.classList.remove('active-playing'));
  const row = document.getElementById(sentRowId(inf, idx));
  if(row) row.classList.add('active-playing');
  const u = speakDE(stripHTML(s.de));
  if(u){
    u.onend = () => {
      if(loopingSentenceKey !== key) return;
      loopTimeout = setTimeout(() => runLoopStep(inf, idx, key), 1200);
    };
  }
}

function toggleAllPlay(themaId, inf){
  const btn = document.getElementById(`allplayBtn_${cssId(inf)}`);
  if(allPlayState && allPlayState.inf === inf){
    clearTimeout(allPlayState.timeout);
    window.speechSynthesis.cancel();
    allPlayState = null;
    document.querySelectorAll('.sent-row.active-playing').forEach(el => el.classList.remove('active-playing'));
    if(btn){ btn.classList.remove('stop'); btn.textContent = '▶️ Alle 6 nacheinander abspielen'; }
    return;
  }
  stopAllAudio();
  allPlayState = { inf, idx: 0, timeout: null };
  if(btn){ btn.classList.add('stop'); btn.textContent = '⏹ Stopp'; }
  runAllPlayStep(inf);
}

function runAllPlayStep(inf){
  if(!allPlayState || allPlayState.inf !== inf) return;
  const v = THEMEN.find(t => t.id === curThemaId)?.verbs.find(x => x.inf === inf);
  if(!v || allPlayState.idx >= v.sentences.length){
    const btn = document.getElementById(`allplayBtn_${cssId(inf)}`);
    if(btn){ btn.classList.remove('stop'); btn.textContent = '▶️ Alle 6 nacheinander abspielen'; }
    document.querySelectorAll('.sent-row.active-playing').forEach(el => el.classList.remove('active-playing'));
    allPlayState = null;
    return;
  }
  const idx = allPlayState.idx;
  document.querySelectorAll('.sent-row.active-playing').forEach(el => el.classList.remove('active-playing'));
  const row = document.getElementById(sentRowId(inf, idx));
  if(row) row.classList.add('active-playing');
  const u = speakDE(stripHTML(v.sentences[idx].de));
  if(u){
    u.onend = () => {
      if(!allPlayState || allPlayState.inf !== inf) return;
      allPlayState.idx++;
      allPlayState.timeout = setTimeout(() => runAllPlayStep(inf), 900);
    };
  }
}

/* ---- Record & compare (Web Speech Recognition, same diff-highlight
   pattern used in the exam simulators) ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecInf = null, activeRecIdx = null, recObj = null;

function diffHighlight(a, b){
  let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++;
  let j=0; while(j<a.length-i && j<b.length-i && a[a.length-1-j]===b[b.length-1-j]) j++;
  const aMid=a.slice(i,a.length-j), bMid=b.slice(i,b.length-j);
  const wrap=(s)=> s?`<span class="diffchar">${s}</span>`:'';
  return { a: a.slice(0,i)+wrap(aMid)+a.slice(a.length-j), b: b.slice(0,i)+wrap(bMid)+b.slice(b.length-j) };
}

function toggleRecordSentence(inf, idx){
  if(!SR){
    alert('Spracherkennung wird in diesem Browser nicht unterstützt. Bitte Chrome oder Edge verwenden.\n(Speech recognition not supported. Please use Chrome or Edge.)');
    return;
  }
  const btn = document.getElementById(`recBtn_${cssId(inf)}_${idx}`);
  if(activeRecInf === inf && activeRecIdx === idx){
    if(recObj) recObj.stop();
    return;
  }
  stopAllAudio();
  activeRecInf = inf; activeRecIdx = idx;
  if(btn) btn.classList.add('rec-on');

  recObj = new SR();
  recObj.lang = 'de-DE';
  recObj.interimResults = false;

  recObj.onresult = (ev) => {
    const transcript = ev.results[0][0].transcript;
    const s = findSentence(inf, idx);
    const target = stripHTML(s.de).toLowerCase().trim();
    const spoken = transcript.toLowerCase().trim();
    const diff = diffHighlight(target, spoken);
    const box = document.getElementById(`transcript_${cssId(inf)}_${idx}`);
    if(box){
      box.innerHTML = `
        <span class="transcript-label">Du hast gesagt:</span>
        <div style="margin-bottom:6px;">${diff.b}</div>
        <span class="transcript-label">Ziel:</span>
        <div>${diff.a}</div>
      `;
      box.classList.add('visible');
    }
  };
  recObj.onerror = () => stopRecording(btn);
  recObj.onend = () => stopRecording(btn);
  recObj.start();
}

function stopRecording(btn){
  if(btn) btn.classList.remove('rec-on');
  activeRecInf = null; activeRecIdx = null;
  recObj = null;
}
